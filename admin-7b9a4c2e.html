<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>homeクラ 配信ポータル 管理画面</title>
    <style>
        body { font-family: sans-serif; background: #eef3ee; color: #1a2418; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #f7faf7; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #d8e2d7; }
        h2 { margin-top: 0; color: #2d5a27; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; }
        input[type="text"], input[type="color"] { width: 100%; padding: 8px; box-sizing: border-box; border-radius: 6px; border: 1px solid #d8e2d7; }
        input[type="color"] { height: 40px; padding: 2px; }
        .btn-box { margin-top: 15px; display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-save { background: #2d5a27; color: white; }
        .btn-export { background: #2563eb; color: white; }
        .member-item { background: #f0f5f0; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #d8e2d7; }
        .member-info { font-size: 14px; }
        .btn-del { background: #dc2626; color: white; padding: 4px 10px; font-size: 12px; border-radius: 4px; width: auto; flex: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>👥 メンバー追加・編集</h2>
    <div id="memberForm">
        <div class="form-group"><label>名前</label><input type="text" id="m_name" placeholder="例: まぐにぃ"></div>
        <div class="form-group"><label>YouTube チャンネルID</label><input type="text" id="m_id" placeholder="例: UCMP7QuS4suoONg47Nbi-wrg"></div>
        <div class="form-group"><label>Minecraft ID (Java版) <span>※空欄ならComing soon</span></label><input type="text" id="m_mc" placeholder="例: magunee"></div>
        <div class="form-group"><label>X (旧Twitter) ID</label><input type="text" id="m_x" placeholder="例: maguro29"></div>
        <div class="form-group"><label>Twitch ID</label><input type="text" id="m_tw" placeholder="例: maguro29game"></div>
        <div class="form-group"><label>Instagram ID</label><input type="text" id="m_inst" placeholder="例: "></div>
        <div class="form-group"><label>Discord 招待URL</label><input type="text" id="m_discord" placeholder="https://discord.gg/..."></div>
        <div class="form-group"><label>メンバーカラー</label><input type="color" id="m_color" value="#ff9900"></div>
        <div class="btn-box">
            <button class="btn-save" onclick="addMember()">メンバーを保存</button>
        </div>
    </div>

    <hr style="border:0; border-top:1px solid #d8e2d7; margin:20px 0;">

    <h2>📋 現在の登録メンバー一覧</h2>
    <div id="memberList"></div>

    <div class="btn-box" style="margin-top:20px;">
        <button class="btn-export" onclick="exportConfig()">config.js用のデータをクリップボードにコピー</button>
    </div>
</div>

<script src="config.js"></script>
<script>
let channels = [];

function initAdmin() {
    const saved = localStorage.getItem('custom_channels');
    if (saved) { channels = JSON.parse(saved); }
    else if (typeof CONFIG !== 'undefined' && CONFIG.DEFAULT_CHANNELS) { channels = [...CONFIG.DEFAULT_CHANNELS]; }
    renderMemberList();
}

function renderMemberList() {
    const list = document.getElementById('memberList');
    list.innerHTML = channels.length ? "" : "<p style='color:#5c6b5a; font-size:13px;'>メンバーが登録されていません。</p>";
    channels.forEach((ch, idx) => {
        const mcText = ch.minecraftId ? ` [MC: ${ch.minecraftId}]` : ' [MC: 未設定]';
        list.innerHTML += `
            <div class="member-item">
                <div class="member-info">
                    <span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:${ch.color}; margin-right:6px;"></span>
                    <strong>${ch.name}</strong>${mcText}
                </div>
                <button class="btn-del" onclick="deleteMember(${idx})">削除</button>
            </div>
        `;
    });
}

function addMember() {
    const name = document.getElementById('m_name').value.trim();
    const id = document.getElementById('m_id').value.trim();
    const minecraftId = document.getElementById('m_mc').value.trim();
    const twitterId = document.getElementById('m_x').value.trim();
    const twitchId = document.getElementById('m_tw').value.trim();
    const instaId = document.getElementById('m_inst').value.trim();
    const discordUrl = document.getElementById('m_discord').value.trim();
    const color = document.getElementById('m_color').value;

    if (!name || !id) { alert("名前とYouTubeチャンネルIDは必須です！"); return; }

    const newChannel = { name, id, minecraftId, twitterId, twitchId, tiktokId:"", instaId, discordUrl, color };
    channels.push(newChannel);
    localStorage.setItem('custom_channels', JSON.stringify(channels));
    
    // フォームクリア
    document.getElementById('m_name').value = "";
    document.getElementById('m_id').value = "";
    document.getElementById('m_mc').value = "";
    document.getElementById('m_x').value = "";
    document.getElementById('m_tw').value = "";
    document.getElementById('m_inst').value = "";
    document.getElementById('m_discord').value = "";
    
    renderMemberList();
    alert(`${name} さんを保存しました！`);
}

function deleteMember(idx) {
    if (confirm(`${channels[idx].name} さんを削除しますか？`)) {
        channels.splice(idx, 1);
        localStorage.setItem('custom_channels', JSON.stringify(channels));
        renderMemberList();
    }
}

function exportConfig() {
    const output = `const CONFIG = {\n    YOUTUBE_API_KEY: "ここにあなたのAPIキー",\n    DEFAULT_CHANNELS: ${JSON.stringify(channels, null, 8)}\n};`;
    navigator.clipboard.writeText(output).then(() => {
        alert("config.js 用のコードをコピーしました！config.jsファイルに貼り付けて保存してください。");
    });
}

initAdmin();
</script>
</body>
</html>
