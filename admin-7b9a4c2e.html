<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>homeクラ 配信ポータル 管理画面</title>
    <style>
        /* 🌿 画面全体を白から「目に優しい薄緑」に変更しました */
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background: #eef3ee; /* ポータルと同じ、ごく薄いナチュラルな緑 */
            color: #1a2418;      /* 文字色も真っ黒ではなく、深みのある濃い緑にしてマイルドに */
        }
        
        h2 { border-bottom: 2px solid #2d5a27; padding-bottom: 8px; color: #2d5a27; }
        
        /* 🟢 フォーム部分のコンテナ背景も優しいホワイトグリーンに */
        #memberFormContainer {
            background: #f7faf7;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #d8e2d7;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 180px; font-weight: bold; }
        
        /* ⌨️ 入力欄も真っ白を廃止して、ほんのり薄緑に */
        input[type="text"] { 
            width: 400px; 
            padding: 6px; 
            background: #f0f5f0; 
            border: 1px solid #d8e2d7; 
            border-radius: 4px;
            color: #1a2418;
        }
        input[type="text"]:focus {
            background: #ffffff; /* 入力中だけ白にして見やすく */
            border-color: #2d5a27;
            outline: none;
        }
        input[type="color"] { width: 60px; height: 28px; vertical-align: middle; border: 1px solid #d8e2d7; background: #f0f5f0; }
        
        button { padding: 6px 12px; margin-top: 10px; cursor: pointer; border-radius: 4px; }
        .btn-save { background: #2d5a27; color: white; border: none; font-weight: bold; }
        .btn-save:hover { opacity: 0.9; }
        .btn-export { background: #2563eb; color: white; border: none; font-weight: bold; padding: 10px 20px; }
        .btn-export:hover { opacity: 0.9; }
        
        /* ✏️ 編集中のフォーム（オレンジ〜黄色系も目に優しいトーンに） */
        .editing { background: #fffbeb !important; border: 1px solid #fde68a !important; }
        .edit-badge { display: inline-block; background: #b45309; color: white; padding: 2px 8px; font-size: 12px; border-radius: 4px; margin-bottom: 10px; font-weight: bold; }

        /* 📋 登録メンバー一覧の表スタイル */
        .member-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #f7faf7; }
        .member-table th, .member-table td { border: 1px solid #d8e2d7; padding: 10px; text-align: left; }
        .member-table th { background: #e2eae2; color: #2d5a27; }
        
        .clickable-name { color: #2d5a27; text-decoration: underline; cursor: pointer; }
        .clickable-name:hover { color: #143311; background: #e2eae2; }

        .btn-del { background: #dc2626; color: white; border: none; padding: 4px 10px; cursor: pointer; border-radius: 4px; }
        .btn-del:hover { opacity: 0.9; }
        
        #cancelBtn { background: #64748b; color: white; border: none; }
        #cancelBtn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h2>👥 メンバー追加・編集</h2>
    <div id="memberFormContainer">
        <div id="editNotice" style="display: none;"><span class="edit-badge">✏️ メンバー編集モード中</span></div>
        <div class="form-group"><label>名前</label><input type="text" id="m_name" placeholder="例: まぐにぃ"></div>
        <div class="form-group"><label>YouTube チャンネルID</label><input type="text" id="m_id" placeholder="例: UCMP7QuS4suoONg47Nbi-wrg"></div>
        <div class="form-group"><label>Minecraft ID (Java版)</label><input type="text" id="m_mc" placeholder="例: magunee (空欄時はComing soon)"></div>
        <div class="form-group"><label>X (旧Twitter) ID</label><input type="text" id="m_x" placeholder="例: maguro29"></div>
        <div class="form-group"><label>Twitch ID</label><input type="text" id="m_tw" placeholder="例: maguro29game"></div>
        <div class="form-group"><label>Instagram ID</label><input type="text" id="m_inst" placeholder="例: "></div>
        <div class="form-group"><label>Discord 招待URL</label><input type="text" id="m_discord" placeholder="https://discord.gg/..."></div>
        <div class="form-group"><label>メンバーカラー</label><input type="color" id="m_color" value="#ff9900"></div>
        
        <button id="saveBtn" class="btn-save" onclick="addMember()">メンバーを保存</button>
        <button id="cancelBtn" style="display:none; margin-left:10px;" onclick="cancelEdit()">編集をキャンセル</button>
    </div>

    <h2 style="margin-top: 40px;">📋 現在の登録メンバー一覧 <span style="font-size:13px; color:#5c6b5a; font-weight:normal;">（名前をクリックすると再編集できます）</span></h2>
    <table class="member-table">
        <thead>
            <tr>
                <th>カラー</th>
                <th>名前 (クリックで編集)</th>
                <th>Minecraft ID</th>
                <th>YouTube ID</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="memberTableBody"></tbody>
    </table>

    <div style="margin-top:30px;">
        <button class="btn-export" onclick="exportConfig()">config.js用のデータをクリップボードにコピー</button>
    </div>

<script src="config.js"></script>
<script>
let channels = [];
let editIndex = -1;

function initAdmin() {
    const saved = localStorage.getItem('custom_channels');
    if (saved) { channels = JSON.parse(saved); }
    else if (typeof CONFIG !== 'undefined' && CONFIG.DEFAULT_CHANNELS) { channels = [...CONFIG.DEFAULT_CHANNELS]; }
    renderMemberList();
}

function renderMemberList() {
    const tbody = document.getElementById('memberTableBody');
    if (!channels.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#5c6b5a;">メンバーが登録されていません。</td></tr>`;
        return;
    }
    
    tbody.innerHTML = "";
    channels.forEach((ch, idx) => {
        const mcText = ch.minecraftId ? ch.minecraftId : `<span style="color:#8ca08a; font-size:12px;">未設定 (Coming soon)</span>`;
        tbody.innerHTML += `
            <tr>
                <td style="text-align:center;"><span style="display:inline-block; width:20px; height:20px; border-radius:50%; background:${ch.color}; border:1px solid #d8e2d7;"></span></td>
                <td><strong class="clickable-name" onclick="editMember(${idx})" title="クリックして編集">${ch.name}</strong></td>
                <td>${mcText}</td>
                <td style="font-family:monospace; font-size:12px; color:#414d3f;">${ch.id}</td>
                <td><button class="btn-del" onclick="deleteMember(${idx})">削除</button></td>
            </tr>
        `;
    });
}

function editMember(idx) {
    editIndex = idx;
    const ch = channels[idx];
    
    document.getElementById('m_name').value = ch.name || "";
    document.getElementById('m_id').value = ch.id || "";
    document.getElementById('m_mc').value = ch.minecraftId || "";
    document.getElementById('m_x').value = ch.twitterId || "";
    document.getElementById('m_tw').value = ch.twitchId || "";
    document.getElementById('m_inst').value = ch.instaId || "";
    document.getElementById('m_discord').value = ch.discordUrl || "";
    document.getElementById('m_color').value = ch.color || "#ff9900";
    
    document.getElementById('memberFormContainer').className = "editing";
    document.getElementById('editNotice').style.display = "block";
    document.getElementById('saveBtn').innerText = "変更を上書き保存";
    document.getElementById('cancelBtn').style.display = "inline-block";
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
    editIndex = -1;
    clearForm();
    document.getElementById('memberFormContainer').className = "";
    document.getElementById('editNotice').style.display = "none";
    document.getElementById('saveBtn').innerText = "メンバーを保存";
    document.getElementById('cancelBtn').style.display = "none";
}

function clearForm() {
    document.getElementById('m_name').value = "";
    document.getElementById('m_id').value = "";
    document.getElementById('m_mc').value = "";
    document.getElementById('m_x').value = "";
    document.getElementById('m_tw').value = "";
    document.getElementById('m_inst').value = "";
    document.getElementById('m_discord').value = "";
    document.getElementById('m_color').value = "#ff9900";
}

function addMember() {
    const name = document.getElementById('m_name').value.trim();
    const id = document.getElementById('m_id').value.trim();
    const minecraftId = document.getElementById('m_mc').value.trim();
    const twitterId = document.getElementById('m_x').value.trim();
    const twitchId = document.getElementById('m_tw').value.trim();
    const instaId = document.getElementById('m_inst').value.trim();
    const discordUrl = document.getElementById('m_discord').value.trim();
    const color = document.getElementById('m_color').value;

    if (!name || !id) { alert("名前とYouTubeチャンネルIDは必須です！"); return; }

    const memberData = { name, id, minecraftId, twitterId, twitchId, tiktokId:"", instaId, discordUrl, color };

    if (editIndex > -1) {
        channels[editIndex] = memberData;
        alert(`${name} さんの情報を更新しました！`);
        cancelEdit();
    } else {
        channels.push(memberData);
        alert(`${name} さんを新規保存しました！`);
        clearForm();
    }
    
    localStorage.setItem('custom_channels', JSON.stringify(channels));
    renderMemberList();
}

function deleteMember(idx) {
    if (confirm(`${channels[idx].name} さんを削除しますか？`)) {
        if (editIndex === idx) cancelEdit();
        
        channels.splice(idx, 1);
        localStorage.setItem('custom_channels', JSON.stringify(channels));
        renderMemberList();
    }
}

function exportConfig() {
    const output = `const CONFIG = {\n    YOUTUBE_API_KEY: "ここにあなたのAPIキー",\n    DEFAULT_CHANNELS: ${JSON.stringify(channels, null, 8)}\n};`;
    navigator.clipboard.writeText(output).then(() => {
        alert("config.js 用のコードをコピーしました！config.jsファイルに貼り付けて保存してください。");
    });
}

initAdmin();
</script>
</body>
</html>
