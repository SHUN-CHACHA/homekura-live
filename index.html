    <link rel="icon" href="https://shun-chacha.github.io/homekura-live/icon.png" type="image/png" sizes="192x192\">\n    <link rel="apple-touch-icon" href="https://shun-chacha.github.io/homekura-live/apple-touch-icon.png">

    <style>
        :root {
            --bg-color: #0f0f0f;
            --header-bg: rgba(31, 31, 31, 0.7);
            --card-bg: rgba(26, 26, 26, 0.85);
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-green: #28a745;
            --accent-yellow: #ffcc00;
            --accent-blue: #007bff;
            --accent-purple: #6f42c1;
            --accent-pink: #e83e8c;
            --live-color: #ff0000;
            --upcoming-color: #ffaa00;
            --new-color: #00aaff;
            --offline-color: #555555;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 20% 20%, rgba(40, 167, 69, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 40%, rgba(0, 123, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 40% 80%, rgba(111, 66, 193, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            padding-top: 80px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-left img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;

        .timer-badge {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            padding: 8px 16px;

            font-size: 13px;

        .timer-badge:hover {

            border-color: rgba(255,255,255,0.3);
        }

        /* 編集ボタンの追加スタイル */
        .btn-manage {
            background: linear-gradient(135deg, #444, #222);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.3s;

        }
        .btn-manage:hover {
            background: linear-gradient(135deg, #555, #333);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-1px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);

            display: flex;
            flex-direction: column;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            cursor: grab;
        }

        .card:active {
            cursor: grabbing;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.2);

        .status-live { background: rgba(255,0,0,0.2); color: #ff4d4d; border: 1px solid rgba(255,0,0,0.3); }

        .status-new { background: rgba(0,170,255,0.2); color: #00aaff; border: 1px solid rgba(0,170,255,0.3); }

        .thumbnail-container {
            position: relative;

            border-radius: 10px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255,255,255,0.05);

        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .card:hover .thumbnail-container img {
            transform: scale(1.03);
        }

        .video-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            margin: 0;
            display: -webkit-box;

            height: 39px;
            color: #e1e1e1;
        }

        .time-info {

        .sns-links {

        .sns-icon {

        .sns-twitter:hover { border-color: #1da1f2; }
        .sns-twitch:hover { border-color: #9146ff; }
        .sns-tiktok:hover { border-color: #fe2c55; }
        .sns-insta:hover { border-color: #e1306c; }
        .sns-discord:hover { border-color: #5865f2; }

        .sns-icon svg {

        .sns-youtube:hover svg { fill: #ff0000; }
        .sns-twitter:hover svg { fill: #1da1f2; }
        .sns-twitch:hover svg { fill: #9146ff; }
        .sns-tiktok:hover svg { fill: #fe2c55; }
        .sns-insta:hover svg { fill: #e1306c; }
        .sns-discord:hover svg { fill: #5865f2; }

        .reserve-btn {

            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;

            margin-left: auto;

        .reserve-btn:hover { background: rgba(255,255,255,0.1); }
        .reserve-btn svg { width: 18px; height: 18px; fill: #888; transition: fill 0.2s; }
        .reserve-btn.active svg { fill: var(--accent-yellow); filter: drop-shadow(0 0 4px rgba(255,204,0,0.6)); }

        /* スケルトンスクリーン */
        .skeleton {

        .add-channel-section {

    <script src="config.js"></script>
    <script>
        const API_KEY = CONFIG.YOUTUBE_API_KEY;
        let timeLeft = 300;

        // デフォルトメンバー
        const defaultChannels = [
            { name: "旬茶", id: "UC_D4p58p9v9vV0Y_1_custom", twitterId: "shun_chacha", color: "#ff8c00" },
            { name: "九重なゆ", id: "UCV_7MhX_U2f-mYol96BvV9g", twitterId: "nayu_kokonoe", color: "#ffc0cb" },
            { name: "猫宮ひなた", id: "UC1519PHn6RVPdk50UU9WVgQ", twitterId: "Nekomiya_Hinata", color: "#6f42c1" }
        ];

        let channels = [];
        let reservedVideos = JSON.parse(localStorage.getItem('reserved_videos')) || [];

        // チャンネルリストと並び順の初期化
        function initChannels() {
            const stored = JSON.parse(localStorage.getItem('custom_channels')) || [];
            const savedOrder = JSON.parse(localStorage.getItem('channel_order'));
            
            if (savedOrder) {
                const allChannels = [...defaultChannels, ...stored];
                channels = savedOrder.map(id => allChannels.find(c => c.id === id)).filter(Boolean);
                allChannels.forEach(c => {
                    if (!channels.some(rc => rc.id === c.id)) channels.push(c);
                });
            } else {
                channels = [...defaultChannels, ...stored];
            }
        }

        // 通知許可の要求
        if (Notification.permission === "default") {
            Notification.requestPermission();
        }

        async function fetchChannelStatus(channel) {
            try {
                // 通常配信・配信予定のチェック
                const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channel.id}&type=video&eventType=live&key=${API_KEY}`;
                const searchRes = await fetch(searchUrl);
                const searchData = await searchRes.json();

                if (searchData.items && searchData.items.length > 0) {
                    const item = searchData.items[0];
                    return {
                        ...channel,
                        status: 'live',
                        title: item.snippet.title,
                        videoId: item.id.videoId,
                        thumbnail: item.snippet.thumbnails.high.url,
                        timeInfo: '🔴 LIVE配信中'
                    };
                }

                // 直近のアップロード動画（新着・予定地）のチェック
                const channelUrl = `https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${channel.id}&key=${API_KEY}`;
                const channelRes = await fetch(channelUrl);
                const channelData = await channelRes.json();

                if (!channelData.items || channelData.items.length === 0) return { ...channel, status: 'offline' };

                const playlistId = channelData.items[0].contentDetails.relatedPlaylists.uploads;
                const playlistUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${playlistId}&maxResults=1&key=${API_KEY}`;
                const playlistRes = await fetch(playlistUrl);
                const playlistData = await playlistRes.json();

                if (playlistData.items && playlistData.items.length > 0) {
                    const latest = playlistData.items[0].snippet;
                    const vId = latest.resourceId.videoId;

                    const videoUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet,liveStreamingDetails&id=${vId}&key=${API_KEY}`;
                    const videoRes = await fetch(videoUrl);
                    const videoData = await videoRes.json();

                    if (videoData.items && videoData.items.length > 0) {
                        const vItem = videoData.items[0];
                        const liveDetails = vItem.liveStreamingDetails;
                        const publishedAt = new Date(latest.publishedAt);
                        const now = new Date();

                        // 配信予定
                        if (liveDetails && liveDetails.scheduledStartTime && !liveDetails.actualStartTime) {
                            const startTime = new Date(liveDetails.scheduledStartTime);
                            return {
                                ...channel,
                                status: 'upcoming',
                                title: latest.title,
                                videoId: vId,
                                thumbnail: latest.thumbnails.high.url,
                                startTime: liveDetails.scheduledStartTime,
                                timeInfo: `📅 予定: ${startTime.toLocaleString('ja-JP', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`
                            };
                        }

                        // 24時間以内の新着動画
                        if (now - publishedAt < 24 * 60 * 60 * 1000) {
                            return {
                                ...channel,
                                status: 'new',
                                title: latest.title,
                                videoId: vId,
                                thumbnail: latest.thumbnails.high.url,
                                timeInfo: `🆕 新着: ${publishedAt.toLocaleString('ja-JP', {hour:'2-digit',minute:'2-digit'})}`
                            };
                        }
                    }
                }

                return { ...channel, status: 'offline' };
            } catch (e) {
                console.error("Error fetching " + channel.name, e);
                return { ...channel, status: 'offline' };
            }
        }

            };
            return `<svg viewBox="0 0 24 24"><path d="${paths[type]}"></path></svg>`;
        }

        function toggleReserve(vId, name, startTime) {
            const index = reservedVideos.findIndex(rv => rv.videoId === vId);
            if (index > -1) {
                reservedVideos.splice(index, 1);
            } else {
                reservedVideos.push({ videoId: vId, name, startTime, notified: false });
            }
            localStorage.setItem('reserved_videos', JSON.stringify(reservedVideos));
            
            const btn = document.querySelector(`[data-video-id="${vId}"]`);
            if (btn) btn.classList.toggle('active');
        }

        async function loadPortal() {
            initChannels();
            const grid = document.getElementById('portal-grid');
            
            // 全メンバーの状態を非同期で一斉取得
            const promises = channels.map(c => fetchChannelStatus(c));
            const results = await promises;

            // ソート順序（LIVE -> 予定 -> 新着 -> オフライン）
            const statusOrder = { 'live': 0, 'upcoming': 1, 'new': 2, 'offline': 3 };
            results.sort((a, b) => statusOrder[a.status] - statusOrder[b.status]);

            grid.innerHTML = '';

            results.forEach(c => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-id', c.id);

                let statusBadge = `<span class="status-badge status-offline">Offline</span>`;
                let thumbnailHtml = `<div class="thumbnail-container"><img src="https://shun-chacha.github.io/homekura-live/offline-thumb.png" alt="Offline"></div>`;
                let titleHtml = `<h4 class="video-title">現在配信外または動画投稿がありません</h4>`;
                let timeHtml = `<div class="time-info">前回の配信からしばらく経過しています</div>`;
                let reserveBtnHtml = '';

                if (c.status === 'live') {
                    statusBadge = `<span class="status-badge status-live"><span style="width:6px;height:6px;background:#ff4d4d;border-radius:50%;display:inline-block;animation:pulse 1s infinite;"></span>Live</span>`;
                    thumbnailHtml = `<div class="thumbnail-container"><a href="https://www.youtube.com/watch?v=${c.videoId}" target="_blank"><img src="${c.thumbnail}" alt="Live"></a></div>`;
                    titleHtml = `<h4 class="video-title">${c.title}</h4>`;
                    timeHtml = `<div class="time-info">${c.timeInfo}</div>`;
                } else if (c.status === 'upcoming') {
                    statusBadge = `<span class="status-badge status-upcoming">Upcoming</span>`;
                    thumbnailHtml = `<div class="thumbnail-container"><a href="https://www.youtube.com/watch?v=${c.videoId}" target="_blank"><img src="${c.thumbnail}" alt="Upcoming"></a></div>`;
                    titleHtml = `<h4 class="video-title">${c.title}</h4>`;
                    timeHtml = `<div class="time-info">${c.timeInfo}</div>`;
                    
                    const isReserved = reservedVideos.some(rv => rv.videoId === c.videoId);
                    reserveBtnHtml = `
                        <button class="reserve-btn ${isReserved ? 'active' : ''}" data-video-id="${c.videoId}" onclick="toggleReserve('${c.videoId}', '${c.name}', '${c.startTime}')" title="配信開始時に通知を受け取る">
                            <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1-1.5-1s-1.5.17-1.5 1v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                        </button>
                    `;
                } else if (c.status === 'new') {
                    statusBadge = `<span class="status-badge status-new">New Video</span>`;
                    thumbnailHtml = `<div class="thumbnail-container"><a href="https://www.youtube.com/watch?v=${c.videoId}" target="_blank"><img src="${c.thumbnail}" alt="New Video"></a></div>`;
                    titleHtml = `<h4 class="video-title">${c.title}</h4>`;
                    timeHtml = `<div class="time-info">${c.timeInfo}</div>`;
                }

                // SNSリンク構築
                let snsHtml = `<a class="sns-icon sns-youtube" href="https://www.youtube.com/channel/${c.id}" target="_blank" title="YouTube">${createSvgIcon('youtube')}</a>`;
                if (c.twitterId) snsHtml += `<a class="sns-icon sns-twitter" href="https://twitter.com/${c.twitterId}" target="_blank" title="Twitter">${createSvgIcon('twitter')}</a>`;
                if (c.twitchId) snsHtml += `<a class="sns-icon sns-twitch" href="https://twitch.tv/${c.twitchId}" target="_blank" title="Twitch">${createSvgIcon('twitch')}</a>`;
                if (c.tiktokId) snsHtml += `<a class="sns-icon sns-tiktok" href="https://www.tiktok.com/@${c.tiktokId}" target="_blank" title="TikTok">${createSvgIcon('tiktok')}</a>`;
                if (c.instaId) snsHtml += `<a class="sns-icon sns-insta" href="https://instagram.com/${c.instaId}" target="_blank" title="Instagram">${createSvgIcon('insta')}</a>`;
                if (c.discordUrl) snsHtml += `<a class="sns-icon sns-discord" href="${c.discordUrl}" target="_blank" title="Discord">${createSvgIcon('discord')}</a>`;

                card.innerHTML = `
                    <div class="card-header-color" style="background-color: ${c.color || 'var(--border-color)'}"></div>
                    <div class="card-body">
                        <div class="streamer-info">
                            <h3 class="streamer-name">${c.name}</h3>
                            ${statusBadge}
                            ${reserveBtnHtml}
                        </div>
                        ${thumbnailHtml}
                        ${titleHtml}
                        ${timeHtml}
                        <div class="sns-links">${snsHtml}</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Sortable.js による並び替え設定
            Sortable.create(grid, {
                animation: 150,
                onEnd: function() {
                    const currentOrder = Array.from(grid.querySelectorAll('.card')).map(el => el.getAttribute('data-id'));
                    localStorage.setItem('channel_order', JSON.stringify(currentOrder));
                }
            });
        }

        // 定期通知チェック
        function checkReservations() {
            const now = new Date();
            let changed = false;

            reservedVideos.forEach(rv => {
                if (!rv.notified && new Date(rv.startTime) <= now) {
                    new Notification("配信開始！", { body: `${rv.name}さんの配信が始まるよ！`, icon: "https://shun-chacha.github.io/homekura-live/icon.png" });
                    rv.notified = true;
                    changed = true;
                }
            });
            if (changed) localStorage.setItem('reserved_videos', JSON.stringify(reservedVideos));
        }

        // 旧方式の追加・削除用スタブ関数（エラー防止用）
        function addChannel() { console.log("フォームはmanage.htmlへ移動しました"); }
        function deleteChannel(id) { console.log("削除機能はmanage.htmlへ移動しました"); }

        function manualRefresh() { location.reload(); }

        setInterval(() => {
            timeLeft--; 
            if (timeLeft < 0) location.reload();
            document.getElementById('timer').innerText = `Next Update: ${String(Math.floor(timeLeft/60)).padStart(2, '0')}:${String(timeLeft%60).padStart(2, '0')}`;
            checkReservations();
        }, 1000);

        // 初回ロード
        loadPortal();
    </script>
</body>
</html>
</script>
</body>
</html>
