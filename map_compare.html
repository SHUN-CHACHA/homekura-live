<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地図の比較 | homeクラ</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="shared/theme.css">

    <!-- 📊 地図画像の一覧（mapImageList）は minecraft_map.html と共通のものを使う -->
    <script src="js/map/map-config.js"></script>
    <!-- 📍 メンバーの拠点名を表示するためのデータ -->
    <script src="js/data/MAP_member.js"></script>
    <!-- 📍 「場所」（メンバーではない目印）の名前を表示するためのデータ -->
    <script src="js/data/MAP_locations.js"></script>
    <!-- 🧩 名前ON/OFFトグル・ズームスライダーは minecraft_map.html と共通のコンポーネントを使う -->
    <script src="js/map/name-toggle.js"></script>
    <script src="js/map/zoom-slider.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #0d0d0f;
            overflow: hidden;
        }

        /* 🔝 上部バー：戻るボタン + 拡大縮小スライダー（2つの地図は連動しているので共通で1つだけ） */
        #top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            z-index: 1100;
            background: rgba(26, 26, 31, 0.95);
            border-bottom: 1px solid #333339;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 12px;
            box-sizing: border-box;
        }
        #zoom-slider-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #zoom-slider-label {
            font-size: 11px;
            font-family: monospace;
            color: #cbd5c9;
            width: 40px;
            flex-shrink: 0;
            text-align: right;
        }
        #zoom-slider {
            width: 160px;
            accent-color: #4caf50;
            cursor: pointer;
        }

        #compare-wrap {
            display: flex;
            width: 100vw;
            height: calc(100vh - 50px);
            margin-top: 50px;
        }
        .compare-pane {
            position: relative;
            flex: 1 1 50%;
            height: 100%;
            min-width: 0;
        }
        .compare-pane + .compare-pane {
            border-left: 2px solid #333339;
        }
        .compare-map {
            width: 100%;
            height: 100%;
            background: #141417;
        }
        .compare-select {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(26, 26, 31, 0.92);
            color: #e5e5e5;
            border: 1px solid #4caf50;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 13px;
            max-width: 60%;
        }
        .compare-select:focus { outline: none; border-color: #7ee787; }

        #toggle-names-btn.is-off {
            background: #26262b;
            color: #888;
            border-color: #4a4a52;
        }
        #toggle-names-btn.is-off:hover {
            background: #333339;
            color: #aaa;
        }

        /* 名前ON/OFF切り替え：OFF時は両方の地図のマーカー（名前・場所テキスト）をまとめて非表示にする */
        #compare-wrap.icons-hidden .leaflet-marker-pane {
            display: none !important;
        }

        /* 📍 メンバーの拠点名（文字だけ）のラベル */
        .compare-name-tag {
            position: absolute;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 4px #000;
            pointer-events: none;
            line-height: 1.3;
            text-align: center;
        }
    </style>
    <!-- Cloudflare Web Analytics (要: 実トークンに差し替え。Cloudflareダッシュボード > Web Analytics > Add a site で取得) -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "ef48e3b395a94deb8375d839e1887bb2"}'></script>
    <!-- End Cloudflare Web Analytics -->
</head>
<body>

<div id="top-bar">
    <a href="minecraft_map.html" class="pill-btn-light">🏠 拠点マップに戻る</a>
    <div id="zoom-slider-wrap">
        <span id="zoom-slider-label">1.0×</span>
        <input type="range" id="zoom-slider" min="-3.58496" max="-0.41504" step="0.001" value="-2">
    </div>
    <button id="toggle-names-btn" class="pill-btn-light">📍 名前 ON</button>
</div>

<div id="compare-wrap">
    <div class="compare-pane">
        <select id="select-left" class="compare-select"></select>
        <div id="map-left" class="compare-map"></div>
    </div>
    <div class="compare-pane">
        <select id="select-right" class="compare-select"></select>
        <div id="map-right" class="compare-map"></div>
    </div>
</div>

<script>
    // ==========================================================
    // 🗺️ 2枚の地図画像を左右に並べて見比べるための最小限のページ
    // F11キーでブラウザを全画面表示にすると、地図だけを大きく見比べられます
    // ==========================================================

    function createCompareMap(elId) {
        const map = L.map(elId, {
            crs: L.CRS.Simple,
            minZoom: -3.58496, // 1/3倍（初期表示を1倍とした場合）
            maxZoom: -0.41504, // 3倍（初期表示を1倍とした場合）
            zoomSnap: 0,        // 無段階ズーム
            zoomControl: false, // +/-ボタンは使わず、共通のスライダーに一本化する
            attributionControl: false
        });
        map.setView([0, 0], -2);
        return map;
    }

    const mapLeft = createCompareMap('map-left');
    const mapRight = createCompareMap('map-right');

    const mapImageList = (window.MapApp && window.MapApp.mapConfig) ? window.MapApp.mapConfig.mapImageList : [];
    const getMapLabel = (window.MapApp && window.MapApp.mapConfig) ? window.MapApp.mapConfig.getMapLabel : (f => f);
    const toLeafletBounds = (window.MapApp && window.MapApp.mapConfig) ? window.MapApp.mapConfig.toLeafletBounds : (b => b);

    function populateSelect(selectEl, defaultIndex) {
        selectEl.innerHTML = '';
        mapImageList.forEach((entry, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = getMapLabel(entry.fileName);
            selectEl.appendChild(option);
        });
        selectEl.value = defaultIndex;
    }

    function makeOverlayController(map) {
        let overlay = null;
        return function setImage(index) {
            if (overlay) {
                map.removeLayer(overlay);
                overlay = null;
            }
            const entry = mapImageList[index];
            if (!entry) return;
            overlay = L.imageOverlay(entry.fileName, toLeafletBounds(entry.bounds), {
                opacity: entry.opacity,
                interactive: false
            });
            overlay.on('error', () => {
                console.log(`背景画像 ${entry.fileName} が見つからないか、ローカル制限でロードできません。`);
            });
            overlay.addTo(map);
        };
    }

    const setLeftImage = makeOverlayController(mapLeft);
    const setRightImage = makeOverlayController(mapRight);

    const selectLeft = document.getElementById('select-left');
    const selectRight = document.getElementById('select-right');

    // 初期表示：左は一番新しい地図、右は2番目に新しい地図（無ければ同じもの）
    populateSelect(selectLeft, 0);
    populateSelect(selectRight, mapImageList.length > 1 ? 1 : 0);
    setLeftImage(Number(selectLeft.value));
    setRightImage(Number(selectRight.value));

    selectLeft.addEventListener('change', (e) => setLeftImage(Number(e.target.value)));
    selectRight.addEventListener('change', (e) => setRightImage(Number(e.target.value)));

    // ==========================================================
    // 🔗 2つの地図のパン・ズームを連動させる（見比べやすくするため）
    // ==========================================================
    let syncing = false;
    function syncMaps(source, target) {
        if (syncing) return;
        syncing = true;
        target.setView(source.getCenter(), source.getZoom(), { animate: false });
        syncing = false;
    }
    mapLeft.on('move zoom', () => syncMaps(mapLeft, mapRight));
    mapRight.on('move zoom', () => syncMaps(mapRight, mapLeft));

    // ==========================================================
    // 📍 メンバーの拠点名（文字だけ）を両方の地図に表示する
    // ==========================================================
    function addNameLabels(map) {
        if (typeof memberData === 'undefined') return;
        memberData.forEach((member) => {
            if (!member.name || member.name.trim() === "") return; // 未登録は表示しない

            const names = [member.name, member.name2, member.name3]
                .filter((n) => n && n.trim() !== "");
            const labelHtml = names.join('<br>');

            const leafletY = -member.z;
            const leafletX = member.x;

            L.marker([leafletY, leafletX], {
                icon: L.divIcon({
                    className: '',
                    html: `<div class="compare-name-tag">${labelHtml}</div>`,
                    iconSize: null
                }),
                interactive: false
            }).addTo(map);
        });
    }

    addNameLabels(mapLeft);
    addNameLabels(mapRight);

    // ==========================================================
    // 📍 「場所」（メンバーではない目印。祭会場・共有地など）の名前を
    //     両方の地図にテキストのみで表示する
    // ==========================================================
    function addLocationLabels(map) {
        if (typeof locationData === 'undefined') return;
        locationData.forEach((loc) => {
            if (!loc.name || loc.name.trim() === "") return;

            const leafletY = -loc.z;
            const leafletX = loc.x;

            L.marker([leafletY, leafletX], {
                icon: L.divIcon({
                    className: '',
                    html: `<div class="compare-name-tag">${loc.name}</div>`,
                    iconSize: null
                }),
                interactive: false
            }).addTo(map);
        });
    }

    addLocationLabels(mapLeft);
    addLocationLabels(mapRight);

    // ==========================================================
    // 🧩 名前ON/OFFトグル・ズームスライダーは minecraft_map.html と共通のコンポーネントを使う
    // （右側の地図はパン・ズーム連動ロジックで自動的に追従するので、基準は左側の地図でOK）
    // ==========================================================
    MapApp.nameToggle.init({ buttonId: 'toggle-names-btn', targetSelector: '#compare-wrap' });
    MapApp.zoomSlider.init({ map: mapLeft });

    window.addEventListener('load', () => {
        mapLeft.invalidateSize();
        mapRight.invalidateSize();
    });
    window.addEventListener('resize', () => {
        mapLeft.invalidateSize();
        mapRight.invalidateSize();
    });
</script>
</body>
</html>
