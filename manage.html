<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homeクラ 配信ポータル - メンバー管理</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: rgba(26, 26, 26, 0.85);
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-green: #28a745;
            --accent-red: #d9534f;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
        }
        h3, h4 {
            margin-top: 0;
            color: inherit;
        }
        .btn-tool {
            background: var(--accent-green); color: #fff !important; border: none; padding: 8px 20px; border-radius: 4px;
            font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block;
        }
        .btn-tool:hover { opacity: 0.8; }
        
        .admin-panel {
            padding: 20px; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); backdrop-filter: blur(10px); margin-bottom: 30px;
        }
        .input-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
        .input-group input[type="text"], .input-group input[type="color"] { background: rgba(128,128,128,0.1); border: 1px solid var(--border-color); color: inherit; padding: 8px; border-radius: 4px; flex: 1; min-width: 120px; font-size: 13px; }

        .list-container { display: flex; flex-direction: column; gap: 8px; }
        .row-item {
            background: var(--card-bg); border-radius: 8px; padding: 12px 15px;
            display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border-color);
            position: relative; backdrop-filter: blur(5px);
        }
        .row-left { display: flex; align-items: center; gap: 15px; }
        .color-badge { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .row-name { font-weight: bold; font-size: 15px; }
        .delete-btn-row { background: rgba(217, 83, 79, 0.2); color: #fff; border: 1px solid #d9534f; border-radius: 4px; width: 32px; height: 32px; cursor: pointer; font-size: 18px; }
        .delete-btn-row:hover { background: rgba(217, 83, 79, 0.5); }
    </style>
</head>
<body>

<div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);">
        <h2 style="margin: 0; font-size: 20px;">👥 配信メンバー管理画面</h2>
        <a href="index.html" class="btn-tool" style="background: #555;">ポータルに戻る</a>
    </header>

    <div class="admin-panel">
        <h4 style="font-size: 14px; margin-bottom: 10px;">➕ 新しい配信者を追加</h4>
        <div class="input-group">
            <input type="text" id="new-name" placeholder="名前">
            <input type="text" id="new-id" placeholder="YouTube ID (UC〜)">
            <input type="text" id="new-twitter" placeholder="X ID">
            <input type="text" id="new-twitch" placeholder="Twitch ID">
        </div>
        <div class="input-group">
            <input type="text" id="new-tiktok" placeholder="TikTok ID">
            <input type="text" id="new-insta" placeholder="Insta ID">
            <input type="text" id="new-discord" placeholder="Discord URL">
            <input type="color" id="new-color" value="#ffffff" style="width: 40px; height: 38px; padding: 0; cursor: pointer;">
            <button class="btn-tool" onclick="addChannel()">追加</button>
        </div>
    </div>

    <h3 style="font-size: 16px;">👥 現在の登録メンバー一覧</h3>
    <div id="allList" class="list-container"></div>
</div>

<script>
// index.html と完全に一致させたデフォルトメンバー
const defaultChannels = [
    {name:"まぐにぃ", id:"UCMP7QuS4suoONg47Nbi-wrg", twitterId:"maguro29", twitchId:"maguro29game", tiktokId:"", instaId:"", discordUrl:"https://discord.gg/bRuT74X7sS", color:"#ff9900"},
    {name:"じゃじゃーん菊地", id:"UCi2kiw8hMo0vMAh5lXiafug", twitterId:"kikuchidaisuke", twitchId:"", tiktokId:"jajakiku", instaId:"", discordUrl:"", color:"#ffff00"},
    {name:"さかいさんだー", id:"UCuk8ABJTVWiApYlEojW_QrA", twitterId:"Sakai_Thunder", twitchId:"", tiktokId:"", instaId:"", discordUrl:"", color:"#ff00ff"},
    {name:"Ｍさん", id:"UCGK0iFuXhfA5VnL64xiKEmQ", twitterId:"maikura_souti", twitchId:"msan_no_nitizyou", tiktokId:"msan_official", instaId:"", discordUrl:"", color:"#00ffff"},
    {name:"タツナミ先生", id:"UCedenULTLYf3DanflEXdRCQ", twitterId:"tatsunami", twitchId:"", tiktokId:"", instaId:"", discordUrl:"", color:"#00ff00"},
    {name:"神近", id:"UCdLe2q91fJkN9GEyDvItp-w", twitterId:"t_kamichika", twitchId:"", tiktokId:"", instaId:"", discordUrl:"", color:"#ffffff"},
    {name:"しろくる", id:"UCTl5XpFddyDsj5woStUPu0w", twitterId:"sirokuru_", twitchId:"sirokuru", tiktokId:"sirokuru", instaId:"", discordUrl:"", color:"#ffffff"},
    {name:"たにし", id:"UCiC8VCiSLD3mxoO-QFKQnBQ", twitterId:"tanishi_manbo", twitchId:"tanishi1200", tiktokId:"", instaId:"", discordUrl:"", color:"#0000ff"},
    {name:"凸もり", id:"UCdN9GjPrqhcrzE27eWNNjxg", twitterId:"mk_2_totsu", twitchId:"totsumori", tiktokId:"", instaId:"", discordUrl:"", color:"#888888"},
    {name:"神宮寺ちゃんねる", id:"UCou8IVB8jJPk56H0farYQdA", twitterId:"jinguji777ch", twitchId:"", tiktokId:"", instaId:"", discordUrl:"", color:"#ff0000"},
    {name:"カズクラ", id:"UCu3Mp1ZimtNvyA-bcfo9VrQ", twitterId:"kazuch0924", twitchId:"", tiktokId:"super_kazukura", instaId:"kazuch0924", discordUrl:"", color:"#ff0000"},
    {name:"たいたい", id:"UCds-nvoKCcvixVXJ_54QcbQ", twitterId:"taitaiMEN1997", twitchId:"taitai19970904", tiktokId:"", instaId:"", discordUrl:"", color:"#00ccff"},
    {name:"岐阜のこみちん", id:"UCw4frqkotySLjJ_CFZR5-7w", twitterId:"komichin0704", twitchId:"", tiktokId:"", instaId:"", discordUrl:"", color:"#ffcc00"},
    {name:"ナナホシナナ", id:"UCncsOsnMBAAaYb6WidBYIDw", twitterId:"nanahoshinana77", twitchId:"nanahoshinana77", tiktokId:"", instaId:"", discordUrl:"", color:"#ff33ff"},
    {name:"月成るくす", id:"UCP9rcDSyTRtnu8EsG2CmLMg", twitterId:"Tsukinari_Lux_", twitchId:"", tiktokId:"", instaId:"tsukinarilux", discordUrl:"", color:"#ffffcc"},

    {name:"久那式リン", id:"UCPs7s2VlkwVWWpjcyjviINA", twitterId:"Kunashiki_Lin_", twitchId:"", tiktokId:"", instaId:"", discordUrl:"", color:"#ffffff"},
    {name:"犬野はる", id:"UCVB16vOi24WElLNbbmOFFsA", twitterId:"VT_InunoHaru", twitchId:"", tiktokId:"", instaId:"", discordUrl:"", color:"#ccffcc"},
    {name:"珍珠花こまり", id:"UCSLCZ5uhCYUMQ9TG9Cs1ERQ", twitterId:"komari_yuki", twitchId:"", tiktokId:"", instaId:"", discordUrl:"", color:"#ffffff"},
    {name:"ぽこにゃん", id:"UCO06KZjWOe6b1tXrgzzakZA", twitterId:"pokonyan1185", twitterId:"", tiktokId:"", instaId:"", discordUrl:"", color:"#00ff00"},
    {name:"KtR（こーたろー）", id:"UCuJVrV6spfu9QUP6Wr4fugA", twitterId:"HAOKtR", twitchId:"", tiktokId:"", instaId:"", discordUrl:"", color:"#3399ff"}
];

let channels = [];

function init() {
    // ローカルストレージからデザイン色をロードして同期
    const savedColor = localStorage.getItem('custom_bg_color') || '#0f0f0f';
    document.documentElement.style.setProperty('--bg-color', savedColor);
    const r = parseInt(savedColor.substring(1,3), 16), g = parseInt(savedColor.substring(3,5), 16), b = parseInt(savedColor.substring(5,7), 16);
    const textColor = (r*299 + g*587 + b*114) / 1000 > 128 ? '#000000' : '#ffffff';
    document.documentElement.style.setProperty('--text-color', textColor);

    const saved = localStorage.getItem('custom_channels');
    channels = saved ? JSON.parse(saved) : [...defaultChannels];
    
    renderList();
}

function renderList() {
    let html = "";
    channels.forEach(ch => {
        html += `
        <div class="row-item" data-id="${ch.id}">
            <div class="row-left">
                <span class="color-badge" style="background: ${ch.color || '#fff'}"></span>
                <span class="row-name" style="color:${ch.color}">${ch.name}</span>
            </div>
            <button class="delete-btn-row" onclick="deleteChannel('${ch.id}')">×</button>
        </div>`;
    });
    document.getElementById("allList").innerHTML = html;
}

function addChannel() {
    const getVal = id => document.getElementById(id).value.trim();
    const name = getVal('new-name'), id = getVal('new-id');
    if (!name || !id) { alert("名前とYouTube IDは必須だよ！"); return; }
    
    channels.push({ 
        name, id, 
        twitterId: getVal('new-twitter'), 
        twitchId: getVal('new-twitch'), 
        tiktokId: getVal('new-tiktok'), 
        instaId: getVal('new-insta'), 
        discordUrl: getVal('new-discord'), 
        color: document.getElementById('new-color').value 
    });
    
    localStorage.setItem('custom_channels', JSON.stringify(channels));
    
    // フォームクリア
    document.getElementById('new-name').value = '';
    document.getElementById('new-id').value = '';
    document.getElementById('new-twitter').value = '';
    document.getElementById('new-twitch').value = '';
    document.getElementById('new-tiktok').value = '';
    document.getElementById('new-insta').value = '';
    document.getElementById('new-discord').value = '';
    
    renderList();
}

function deleteChannel(id) {
    if (confirm("リストから削除するよ？")) {
        channels = channels.filter(c => c.id !== id);
        localStorage.setItem('custom_channels', JSON.stringify(channels));
        renderList();
    }
}

init();
</script>
</body>
</html>
