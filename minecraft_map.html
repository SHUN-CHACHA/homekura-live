<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homeクラ Season２ メンバー拠点マップ</title>
    
    <!-- Leaflet.js (地図ライブラリ) のCSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            background-color: #121214;
        }
        /* Leafletの地図の背景をマイクラの奈落（Void）のような黒基調にし、グリッド模様を薄く敷く */
        #map-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height:100%;
        }
        #map {
            background-color: #141417;
            background-image: 
                linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e24;
        }
        ::-webkit-scrollbar-thumb {
            background: #4caf50;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #45a049;
        }
        
        /* 💡 マップ上に「常に表示されるメンバー名ネームタグ」のカスタムスタイル */
        .permanent-name-label {
            background: rgba(26, 26, 31, 0.85) !important;
            border: 1px solid #4caf50 !important;
            color: #ffffff !important;
            font-weight: bold !important;
            font-size: 11px !important;
            padding: 2px 6px !important;
            border-radius: 4px !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6) !important;
            white-space: nowrap;
        }
        /* 💡 未登録状態のネームタグを少し目立たなくするスタイル */
        .permanent-name-label.unregistered {
            border: 1px solid #55555d !important;
            color: #88888f !important;
            opacity: 0.6;
        }
        /* 吹き出しの小さな矢印を非表示にする */
        .permanent-name-label::before {
            display: none !important;
        }
        
        /* 外部画像を使わない「光るアニメーションピン」のCSS */
        .pulse-marker {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-core {
            width: 10px;
            height: 10px;
            background-color: #4caf50;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #4caf50;
            z-index: 2;
        }
        /* 未登録（名前が空白）のピンはグレーにする */
        .pulse-marker.unregistered .pulse-core {
            background-color: #55555d;
            border: 2px solid #aaaaaa;
            box-shadow: none;
        }
        .pulse-wave {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: rgba(76, 175, 80, 0.4);
            border-radius: 50%;
            animation: pulse 1.8s infinite ease-out;
            z-index: 1;
        }
        .pulse-marker.unregistered .pulse-wave {
            display: none; /* 未登録のピンは波打つアニメーションをオフにする */
        }
        @keyframes pulse {
            0% {
                transform: scale(0.2);
                opacity: 1;
            }
            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        /* 👤 顔アイコン（メンバーの顔画像）マーカーのスタイル */
        .avatar-marker {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-marker img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
            border: 2px solid #4caf50;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            background-color: #26262b;
        }
        /* 未登録（名前が空白）の場合は少し目立たなく */
        .avatar-marker.unregistered img {
            border: 2px solid #55555d;
            box-shadow: none;
            opacity: 0.55;
            filter: grayscale(1);
        }

        /* 👥 1拠点に2人いる場合、顔アイコンを2つ並べて表示 */
        .avatar-marker-group {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .avatar-marker-group .avatar-marker {
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body class="text-gray-100 bg-[#121214]">

    
<div class="max-w-[1800px] mx-auto p-2 sm:p-4">
<div class="flex flex-col lg:flex-row gap-4 lg:h-screen">

<section class="w-full lg:w-[450px] bg-[#1a1a1f] rounded-xl border border-gray-800 p-4 flex flex-col h-[320px] lg:h-[650px]">
            
            <!-- 検索窓と情報統計 -->

                    <a href="background_image_guide.html"
   class="text-xs bg-[#26262b] hover:bg-[#333339]

    <!-- Leaflet.js のJavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ==========================================================
        // 📊 1. メンバーデータ定義
        // icon: avatars フォルダに入れた顔画像のファイル名をそのまま記入してください（例: "yamachan.png"）
        //       空欄のままだとプレースホルダー画像が表示されます
        // name2 / icon2: 同じ拠点に2人目がいる場合はここに記入（アイコンが2つ並んで表示されます）
        // ==========================================================
        const memberData = [
            { area: "エリア01", name: "Ｍさん", icon: "MrMsan.svg", name2: "", icon2: "", x: 720, z: 0 }, // 01人目
            { area: "エリア02", name: "２８（ふたば）", icon: "ftb28.svg", name2: "", icon2: "", x: 624, z: 360 }, // 02人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 03人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 04人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 05人目
            { area: "エリア06", name: "黎乃鈴 -Kurono Suzu-", icon: "kuronosuzu.svg", name2: "", icon2: "", x: -624, z: 360 }, // 06人目
            { area: "エリア07", name: "ナナホシナナ", icon: "nanahoshiNanaVT.svg", name2: "", icon2: "", x: -720, z: 0 }, // 07人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 08人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 09人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 10人目
            { area: "エリア11", name: "月成るくす", icon: "tsukinarilux.svg", name2: "", icon2: "", x: 360, z: -624 }, // 11人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 12人目
            { area: "エリア13", name: "ぽこにゃん", icon: "pokonyan_0603.svg", name2: "", icon2: "", x: 966, z: 259 }, // 13人目
            { area: "エリア14", name: "久那式リン", icon: "Kunashiki_Lin.svg", name2: "", icon2: "", x: 707, z: 707 }, // 14人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 15人目
            { area: "エリア16", name: "神近", icon: "kamichika.svg", name2: "", icon2: "", x: -259, z: 966 }, // 16人目
            { area: "エリア17", name: "早乙女燈真", icon: "saotomeirix.svg", name2: "", icon2: "", x: -707, z: 707 }, // 17人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 18人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 19人目
            { area: "エリア20", name: "じゃじゃーん菊池", icon: "jajaankikuchi.svg", name2: "", icon2: "", x: -707, z: -707 }, // 20人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 21人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 22人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 23人目
            { area: "エリア24", name: "よいよい", icon: "yoiy0i.svg", name2: "", icon2: "", x: 966, z: -259 }, // 24人目
            { area: "エリア25", name: "LeftLily/レフトリリー", icon: "LeftLily0427.svg", name2: "", icon2: "", x: 1280, z: 0 }, // 25人目
            { area: "エリア26", name: "まぐにぃ", icon: "maguro29.svg", name2: "", icon2: "", x: 1109, z: 640 }, // 26人目
            { area: "エリア27", name: "うえまさ", icon: "uema5a.svg", name2: "", icon2: "", x: 640, z: 1109 }, // 27人目
            { area: "エリア28", name: "珍珠花こまり", icon: "yukiyanagiKOMARI.svg", name2: "", icon2: "", x: 0, z: 1280 }, // 28人目
            { area: "エリア29", name: "うが", icon: "uga_youtube.svg", name2: "", icon2: "", x: -640, z: 1109 }, // 29人目
            { area: "エリア30", name: "ゆりも", icon: "yurimosaaan.svg", name2: "", icon2: "", x: -1109, z: 640 }, // 30人目
            { area: "エリア31", name: "神宮寺", icon: "jingujich.svg", name2: "", icon2: "", x: -1280, z: 0 }, // 31人目
            { area: "エリア32", name: "タツナミ先生", icon: "syuutan.svg", name2: "むっこ氏", icon2: "", x: -1109, z: -640 }, // 32人目（2名）
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }, // 33人目
            { area: "エリア34", name: "鶴太郎", icon: "turu0004.svg", name2: "", icon2: "", x: 0, z: -1280 }, // 34人目
            { area: "エリア35", name: "久遠星那", icon: "kuon_irix.svg", name2: "", icon2: "", x: 640, z: -1109 }, // 35人目
            { area: "", name: "", icon: "", name2: "", icon2: "", x: 0, z: 0 }  // 36人目
        ];

        // ==========================================================
        // 🗺️ 2. ★背景画像の設定（画像を入手したらここを変更します！）
        // ==========================================================
        const bgConfig = {
            fileName: 'world_map.png', // 保存した地形画像のファイル名
            // [Z軸の南端(プラス), X軸の西端(マイナス)], [Z軸の北端(マイナス), X軸の東端(プラス)] の順で指定します。
            // 例：Chunkbaseで切り抜いた範囲が「X: -1600〜1600、Z: -1600〜1600」の場合
            bounds: [[1536, -1536], [-1536, 1536]],
            opacity: 0.75 // 画像の透明度 (0.0 〜 1.0)
        };

        // ==========================================================
        // ⚙️ 3. マップ初期設定 (マイクラ平面座標)
        // ==========================================================
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -4,
            maxZoom: 3,
            zoomDelta: 0.5,
            zoomSnap: 0.5,
            attributionControl: false
        });

        map.setView([0, 0], -2);

        // ==========================================================
        // 🖼️ 4. 背景画像のオーバーレイ配置
        // ==========================================================
        let bgImageOverlay = null;

        function loadBackgroundImage() {
            // 既存の画像レイヤーがあれば一旦地図から削除する
            if (bgImageOverlay) {
                map.removeLayer(bgImageOverlay);
                bgImageOverlay = null;
            }

            // チェックボックスがON、かつ設定した画像ファイル名がある場合にのみ重ねる
            const isChecked = document.getElementById('toggle-bg-image').checked;
            if (isChecked && bgConfig.fileName) {
                bgImageOverlay = L.imageOverlay(bgConfig.fileName, bgConfig.bounds, {
                    opacity: bgConfig.opacity,
                    interactive: false // 画像がクリック操作を遮らないようにする
                });
                
                // 画像が見つからなくても地図全体がクラッシュしないためのエラー対策
                bgImageOverlay.on('error', function() {
                    console.log("背景画像 world_map.png が見つからないか、ローカル制限でロードできません。");
                });
                
                bgImageOverlay.addTo(map);
            }
        }

        // ==========================================================
        // 🗺️ 5. 安全なグリッド(格子線)と座標文字の描画
        // ==========================================================
        try {
            const MinecraftGrid = L.GridLayer.extend({
                createTile: function (coords) {
                    const tile = document.createElement('div');
                    tile.style.borderLeft = '1px solid rgba(255,255,255,0.12)';
                    tile.style.borderBottom = '1px solid rgba(255,255,255,0.12)';
                    tile.style.position = 'relative';
                    
                    const label = document.createElement('span');
                    label.style.position = 'absolute';
                    label.style.bottom = '4px';
                    label.style.left = '4px';
                    label.style.fontSize = '9px';
                    label.style.color = 'rgba(255, 255, 255, 0.15)';
                    label.style.fontFamily = 'monospace';
                    label.style.pointerEvents = 'none';
                    
                    const scale = Math.pow(2, this._map.getZoom());
                    const tileSize = 256;
                    const x = Math.round((coords.x * tileSize) / scale);
                    const z = Math.round((-coords.y * tileSize) / scale);
                    
                    label.textContent = `X:${x}, Z:${z}`;
                    tile.appendChild(label);
                    
                    return tile;
                }
            });
            new MinecraftGrid().addTo(map);
        } catch (e) {
            console.error("Grid skipped:", e);
        }

        // ==========================================================
        // 📏 6. 十字の基準線（X軸・Z軸）の描画
        // ==========================================================
        L.polyline([[4000, 0], [-4000, 0]], { color: '#3b82f6', weight: 2, opacity: 0.6, dashArray: '6, 6' }).addTo(map);
        L.polyline([[0, -4000], [0, 4000]], { color: '#ef4444', weight: 2, opacity: 0.6, dashArray: '6, 6' }).addTo(map);

        // ==========================================================
        // 📌 7. メンバーのピン（マーカー）の配置と一覧表生成
        // ==========================================================
        const markers = {};

        // 顔アイコンが見つからない場合のプレースホルダー画像（灰色のシルエット）
        const AVATAR_FALLBACK = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><rect width="36" height="36" fill="#26262b"/><circle cx="18" cy="14" r="7" fill="#55555d"/><rect x="6" y="23" width="24" height="11" rx="3" fill="#55555d"/></svg>'
        );
        // 画像の読み込みに失敗した場合、プレースホルダーに差し替える
        function avatarFallback(img) {
            img.onerror = null;
            img.src = AVATAR_FALLBACK;
        }

        const tableBody = document.getElementById('member-table-body');
        const countSpan = document.getElementById('member-count');
        countSpan.textContent = memberData.length;

        // データ並び替え (エリアが空白でないものを優先、基本は登録順)
        memberData.sort((a, b) => {
            if (!a.area && b.area) return 1;
            if (a.area && !b.area) return -1;
            return a.area.localeCompare(b.area, undefined, {numeric: true, sensitivity: 'base'});
        });

        // 動的アイコン生成用（顔アイコン版）
        // memberData の icon 欄に指定されたファイル名を avatars フォルダから読み込みます
        // name2 が入っている場合は2人分のアイコンを並べて表示します
        function getIcon(member, isRegistered) {
            const hasSecond = isRegistered && member.name2 && member.name2.trim() !== "";

            if (!hasSecond) {
                const avatarSrc = (isRegistered && member.icon)
                    ? `avatars/${member.icon}`
                    : AVATAR_FALLBACK;
                return L.divIcon({
                    className: 'custom-div-icon',
                    html: `
                        <div class="avatar-marker ${isRegistered ? '' : 'unregistered'}">
                            <img src="${avatarSrc}" alt="${member.name}" onerror="avatarFallback(this)" />
                        </div>
                    `,
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
            }

            // 2人分のアイコンを並べて表示
            const avatarSrc1 = member.icon ? `avatars/${member.icon}` : AVATAR_FALLBACK;
            const avatarSrc2 = member.icon2 ? `avatars/${member.icon2}` : AVATAR_FALLBACK;
            return L.divIcon({
                className: 'custom-div-icon',
                html: `
                    <div class="avatar-marker-group">
                        <div class="avatar-marker">
                            <img src="${avatarSrc1}" alt="${member.name}" onerror="avatarFallback(this)" />
                        </div>
                        <div class="avatar-marker">
                            <img src="${avatarSrc2}" alt="${member.name2}" onerror="avatarFallback(this)" />
                        </div>
                    </div>
                `,
                iconSize: [63, 30],
                iconAnchor: [31, 15]
            });
        }

        function initApp() {
            tableBody.innerHTML = '';
            
            memberData.forEach((member, index) => {
                const leafletY = -member.z;
                const leafletX = member.x;
                const isRegistered = member.name.trim() !== ""; // 名前が入っているかどうか

                // マーカーの設置（顔アイコン）
                const marker = L.marker([leafletY, leafletX], { icon: getIcon(member, isRegistered) }).addTo(map);
                
                // メンバー名を「常に表示」するネームタグを設定（顔アイコン＋名前のみのシンプル表示）
                const hasSecond = isRegistered && member.name2 && member.name2.trim() !== "";
                const tooltipText = isRegistered 
                    ? (hasSecond ? `${member.name}・${member.name2}` : member.name)
                    : `未登録 (枠No.${String(index + 1).padStart(2, '0')})`;
                
                marker.bindTooltip(tooltipText, {
                    permanent: true,
                    direction: 'bottom',
                    offset: [0, 10],
                    className: `permanent-name-label ${isRegistered ? '' : 'unregistered'}`
                });
                
                // 一覧でキーとして使うための名前
                const lookupName = isRegistered ? member.name : `unregistered-${index}`;
                markers[lookupName] = marker;

                // テーブル行作成 (空白の場合は仮の値を薄く表示)
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#222227] cursor-pointer transition-colors border-b border-gray-800 text-gray-300';
                
                const searchName = isRegistered 
                    ? `${member.name} ${member.name2 || ""}`.trim().toLowerCase() 
                    : "";
                const searchArea = member.area ? member.area.toLowerCase() : "";
                tr.setAttribute('data-name', searchName);
                tr.setAttribute('data-area', searchArea);
                
                tr.innerHTML = `
                    <td class="py-3 px-4 font-mono font-bold ${isRegistered ? 'text-green-500' : 'text-gray-600'}">
                        ${member.area || "-"}
                    </td>
                    <td class="py-3 px-4 ${isRegistered ? 'font-medium text-gray-100' : 'text-gray-600 italic'}">
                        ${isRegistered ? (hasSecond ? `${member.name}・${member.name2}` : member.name) : `(未登録 No.${index + 1})`}
                    </td>
                    <td class="py-3 px-4 text-right font-mono ${isRegistered ? 'text-gray-300' : 'text-gray-600'}">
                        ${member.x}
                    </td>
                    <td class="py-3 px-4 text-right font-mono ${isRegistered ? 'text-gray-300' : 'text-gray-600'}">
                        ${member.z}
                    </td>
                `;

                tr.addEventListener('click', () => {
                    focusOnBase(lookupName, leafletY, leafletX);
                });

                tableBody.appendChild(tr);
            });
        }

        // カメラ移動
        function focusOnBase(name, y, x) {
            map.setView([y, x], 1, { animate: true, duration: 0.8 });
        }

        // 中心 (0, 0) に戻る
        function resetMapView() {
            map.setView([0, 0], -2, { animate: true });
        }

        // 🔍 8. リアルタイム検索機能
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const rows = tableBody.getElementsByTagName('tr');
            
            for (let row of rows) {
                const name = row.getAttribute('data-name');
                const area = row.getAttribute('data-area');
                
                // 未登録の行でも、検索欄が空なら表示し、文字が入力されたら非表示にする
                if (query === "") {
                    row.style.display = '';
                } else if (name.includes(query) || area.includes(query)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            }
        });

        // 🧭 9. マウス位置の座標追跡
        const cursorCoords = document.getElementById('cursor-coords');
        map.on('mousemove', (e) => {
            const x = Math.round(e.latlng.lng);
            const z = Math.round(-e.latlng.lat);
            cursorCoords.textContent = `X: ${x}, Z: ${z}`;
        });

        // ==========================================================
        // 🚀 10. アプリ起動とイベント登録
        // ==========================================================
        initApp();

        // 画像切り替えチェックボックスの連動イベント
        document.getElementById('toggle-bg-image').addEventListener('change', loadBackgroundImage);

        window.addEventListener('load', () => {
            loadBackgroundImage(); // 初期表示の段階から画像をロード
            map.invalidateSize();
            setTimeout(() => { map.invalidateSize(); }, 200);
        });

        // 📱 スマホの画面回転・リサイズ時に地図サイズを再計算
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(() => { map.invalidateSize(); }, 300);
        });
    </script>
</body>
</html>
