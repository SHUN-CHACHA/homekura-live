<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homeクラ Season２ メンバー拠点マップ</title>
    
    <!-- Leaflet.js (地図ライブラリ) のCSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            background-color: #121214;
        }
        /* Leafletの地図の背景をマイクラの奈落（Void）のような黒基調にする */
        #map-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height:100%;
        }
        #map {
            background-color: #141417;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
        }
        /* 📏 512刻みのX軸・Z軸ラベル（ルーラー風表示） */
        #axis-labels {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 450;
        }
        .axis-label-x {
            position: absolute;
            top: 4px;
            transform: translateX(-50%);
            font-size: 10px;
            font-family: monospace;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(20, 20, 23, 0.55);
            padding: 1px 5px;
            border-radius: 3px;
            white-space: nowrap;
        }
        .axis-label-z {
            position: absolute;
            right: 4px;
            transform: translateY(-50%);
            font-size: 10px;
            font-family: monospace;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(20, 20, 23, 0.55);
            padding: 1px 5px;
            border-radius: 3px;
            white-space: nowrap;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e24;
        }
        ::-webkit-scrollbar-thumb {
            background: #4caf50;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #45a049;
        }
        
        /* 💡 マップ上に「常に表示されるメンバー名ネームタグ」のカスタムスタイル */
        .permanent-name-label {
            background: rgba(26, 26, 31, 0.85) !important;
            border: 1px solid #4caf50 !important;
            color: #ffffff !important;
            font-weight: bold !important;
            font-size: 11px !important;
            padding: 3px 6px !important;
            border-radius: 4px !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6) !important;
            white-space: nowrap;
            text-align: center;
            line-height: 1.3;
        }
        .permanent-name-label .coord-line {
            font-weight: normal;
            font-size: 11px;
            color: #ffffff;
            margin-top: 1px;
        }
        /* 🔍 スマホ幅ではズームアウト時にアイコン同士が密集して見にくくなるため、座標を非表示にする */
        /* PC幅では常に座標を表示する（このメディアクエリの外なので対象外） */
        @media (max-width: 768px) {
            #map.low-zoom .permanent-name-label .coord-line {
                display: none;
            }
        }
        /* 💡 未登録状態のネームタグを少し目立たなくするスタイル */
        .permanent-name-label.unregistered {
            border: 1px solid #55555d !important;
            color: #88888f !important;
            opacity: 0.6;
        }
        .permanent-name-label.unregistered .coord-line {
            color: #88888f;
        }
        /* 吹き出しの小さな矢印を非表示にする */
        .permanent-name-label::before {
            display: none !important;
        }
        
        /* 外部画像を使わない「光るアニメーションピン」のCSS */
        .pulse-marker {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-core {
            width: 10px;
            height: 10px;
            background-color: #4caf50;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #4caf50;
            z-index: 2;
        }
        /* 未登録（名前が空白）のピンはグレーにする */
        .pulse-marker.unregistered .pulse-core {
            background-color: #55555d;
            border: 2px solid #aaaaaa;
            box-shadow: none;
        }
        .pulse-wave {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: rgba(76, 175, 80, 0.4);
            border-radius: 50%;
            animation: pulse 1.8s infinite ease-out;
            z-index: 1;
        }
        .pulse-marker.unregistered .pulse-wave {
            display: none; /* 未登録のピンは波打つアニメーションをオフにする */
        }
        @keyframes pulse {
            0% {
                transform: scale(0.2);
                opacity: 1;
            }
            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        /* 👤 顔アイコン（メンバーの顔画像）マーカーのスタイル */
        .avatar-marker {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-marker img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
            border: 2px solid #4caf50;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            background-color: #26262b;
        }
        /* 未登録（名前が空白）の場合は少し目立たなく */
        .avatar-marker.unregistered img {
            border: 2px solid #55555d;
            box-shadow: none;
            opacity: 0.55;
            filter: grayscale(1);
        }

        /* 👥 1拠点に2人いる場合、顔アイコンを2つ並べて表示 */
        .avatar-marker-group {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .avatar-marker-group .avatar-marker {
            width: 30px;
            height: 30px;
        }

        /* 🏠 ライトテーマの丸ピルボタン（index.html / admin.htmlと共通デザイン） */
        .pill-btn-light {
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            color: #414d3f;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #d8e2d7;
            background: #eef3ee;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .pill-btn-light:hover {
            background: #e8f5e8;
            color: #2d5a27;
        }

        /* 📱 スマホ幅（lg未満）：マップを全画面表示にし、メンバー一覧はドロワー化する */
        @media (max-width: 1023px) {
            #map-wrap {
                position: fixed !important;
                inset: 0 !important;
                height: 100vh !important;
                width: 100vw !important;
                z-index: 10;
            }
            #map-wrap > section {
                border-radius: 0 !important;
                border: none !important;
                padding-top: var(--mobile-topbar-height, 116px) !important; /* 上部の固定バーの高さ分だけ余白を確保（JSで実測して更新） */
            }

            /* ドロワー全体：index.htmlと同じライトテーマに */
            #member-drawer {
                position: fixed !important;
                top: 0;
                left: 0;
                width: 85% !important;
                max-width: 360px;
                height: 100vh !important;
                z-index: 1280;
                transform: translateX(-100%);
                transition: transform 0.25s ease-out;
                overflow-y: auto;
                padding: 16px 12px;
                background: #eef3ee !important;
                display: block !important; /* テーブル用の固定高さレイアウトをやめ、自然な縦積みにする */
            }
            #member-drawer.drawer-open {
                transform: translateX(0);
            }
            #member-drawer .drawer-header {
                background: transparent !important;
                border: none !important;
                padding: 0 0 16px !important;
                text-align: left !important;
            }
            #member-drawer .drawer-header h1 {
                color: #2d5a27 !important;
                font-size: 18px !important;
            }
            #member-drawer .drawer-header p {
                color: #414d3f !important;
                font-size: 12px !important;
            }
            #member-drawer .drawer-panel {
                background: transparent !important;
                border: none !important;
                padding: 0 !important;
                height: auto !important;
                display: block !important;
            }
            #member-drawer #member-count {
                color: #2d5a27 !important;
            }
            #member-drawer #member-count-label {
                color: #414d3f !important;
            }
            #member-drawer #download-files-btn,
            #member-drawer a[href="background_image_guide.html"] {
                background: #eef3ee !important;
                border-color: #d8e2d7 !important;
                color: #414d3f !important;
            }
            #member-drawer #download-files-btn:hover,
            #member-drawer a[href="background_image_guide.html"]:hover {
                background: #e8f5e8 !important;
                color: #2d5a27 !important;
            }
            #member-drawer #search-input {
                background: #ffffff !important;
                border: 1px solid #d8e2d7 !important;
                color: #1a2418 !important;
            }
            #member-drawer #search-input::placeholder {
                color: #7c8a79 !important;
            }
            #member-drawer .drawer-hint {
                color: #7c8a79 !important;
            }
            /* デスクトップ用のテーブルはスマホでは非表示、代わりにカード一覧を表示 */
            #member-drawer .desktop-table-wrap {
                display: none !important;
            }
            #mobile-member-list {
                display: flex !important;
            }
        }

        /* 📱 スマホ用メンバーカード一覧（PCでは非表示） */
        #mobile-member-list {
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        #mobile-member-list .mobile-member-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            border: 1px solid #d8e2d7;
            border-radius: 10px;
            padding: 8px 10px;
            cursor: pointer;
            transition: background 0.15s;
        }
        #mobile-member-list .mobile-member-row:active,
        #mobile-member-list .mobile-member-row:hover {
            background: #e8f5e8;
        }
        #mobile-member-list .mm-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
            background: #eef3ee;
            border: 1px solid #d8e2d7;
            flex-shrink: 0;
        }
        #mobile-member-list .mm-text { min-width: 0; }
        #mobile-member-list .mm-name {
            font-weight: bold;
            font-size: 13px;
            color: #1a2418;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #mobile-member-list .mm-area {
            font-size: 11px;
            color: #7c8a79;
        }
    </style>
</head>

    <!-- Leaflet.js のJavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- 📊 メンバーデータは memberlist.js に分離（編集はそちらのファイルで） -->
    <script src="memberlist.js"></script>

    <script>
        // ==========================================================
        // 📊 1. メンバーデータ定義（memberlist.js から読み込み済み）
        // ==========================================================

        // ==========================================================
        // 🗺️ 2. ★背景画像の設定（新しい月の地図ができたらここに追記します！）
        // ==========================================================
        // 毎月の地図画像は "map" フォルダの中に入れてください（ファイル名: MMDDworld_map.png）
        // 例：7月4日の画像なら map/0704world_map.png
        // 一番上（配列の先頭）が「初期表示される最新の地図」になります。新しい月の画像は
        // 配列の先頭に追加してください。
        const mapImageList = [
            {
                fileName: 'map/0704world_map.png',
                // [X座標, Z座標] の順で、画像の対角の2点を指定します（順不同でOK）。
                // 例：Chunkbaseで切り抜いた範囲が「X: -1600〜1600、Z: -1600〜1600」の場合
                //     bounds: [[-1600, -1600], [1600, 1600]]
                bounds: [[-1600, -1600], [1984, 1472]],
                opacity: 0.75 // 画像の透明度 (0.0 〜 1.0)
            }
            // 新しい月の地図を追加する例（先頭に追加）：
            // {
            //     fileName: 'map/0801world_map.png',
            //     bounds: [[-1600, -1600], [1984, 1472]],
            //     opacity: 0.75
            // },
        ];

        // ファイル名の先頭4桁（MMDD）から「◯月◯日 地図」というラベルを自動生成する
        function getMapLabel(fileName) {
            const base = fileName.split('/').pop();
            const match = base.match(/^(\d{2})(\d{2})/);
            if (!match) return base;
            const month = parseInt(match[1], 10);
            const day = parseInt(match[2], 10);
            return `${month}月${day}日 地図`;
        }

        // bounds([X, Z]の順)をLeafletが要求する[Z由来の緯度, X由来の経度]の順に変換する
        function toLeafletBounds(bounds) {
            return bounds.map(([x, z]) => [-z, x]);
        }

        // ==========================================================
        // ⚙️ 3. マップ初期設定 (マイクラ平面座標)
        // ==========================================================
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -4,
            maxZoom: 3,
            zoomDelta: 0.25,
            zoomSnap: 0.25,
            attributionControl: false
        });

        map.setView([0, 0], -2);

        // ==========================================================
        // 🖼️ 4. 背景画像のオーバーレイ配置
        // ==========================================================
        let bgImageOverlay = null;
        const mapImageSelects = () => Array.from(document.querySelectorAll('.map-image-select'));

        // ドロップダウンに mapImageList の一覧を反映する（先頭＝最新が選択された状態で開始）
        // デスクトップ用・スマホ用など、複数箇所にある .map-image-select すべてに反映する
        function populateMapImageSelect() {
            mapImageSelects().forEach((sel) => {
                sel.innerHTML = '';
                mapImageList.forEach((entry, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = getMapLabel(entry.fileName);
                    sel.appendChild(option);
                });
            });
        }

        // どれか1つのドロップダウンが変更されたら、他のドロップダウンにも同じ選択を反映する
        function syncMapImageSelects(value) {
            mapImageSelects().forEach((sel) => { sel.value = value; });
        }

        function loadBackgroundImage() {
            // 既存の画像レイヤーがあれば一旦地図から削除する
            if (bgImageOverlay) {
                map.removeLayer(bgImageOverlay);
                bgImageOverlay = null;
            }

            // チェックボックスがON、かつ選択中の地図画像がある場合にのみ重ねる
            const isChecked = document.getElementById('toggle-bg-image').checked;
            const currentSelect = mapImageSelects()[0];
            const selectedEntry = mapImageList[Number(currentSelect ? currentSelect.value : 0)] || mapImageList[0];

            if (isChecked && selectedEntry && selectedEntry.fileName) {
                bgImageOverlay = L.imageOverlay(selectedEntry.fileName, toLeafletBounds(selectedEntry.bounds), {
                    opacity: selectedEntry.opacity,
                    interactive: false // 画像がクリック操作を遮らないようにする
                });
                
                // 画像が見つからなくても地図全体がクラッシュしないためのエラー対策
                bgImageOverlay.on('error', function() {
                    console.log(`背景画像 ${selectedEntry.fileName} が見つからないか、ローカル制限でロードできません。`);
                });
                
                bgImageOverlay.addTo(map);
            }
        }

        // ==========================================================
        // 📏 5-2. 動的格子線（X:0, Z:0 を起点に256ブロックごと）
        // 表示範囲（パン・ズーム）に合わせて、見えている範囲全体をカバーするように再描画する
        // ==========================================================
        const GRID_INTERVAL = 256;
        const gridLayerGroup = L.layerGroup().addTo(map);

        function updateGrid() {
            gridLayerGroup.clearLayers();

            const bounds = map.getBounds();
            const west = bounds.getWest();
            const east = bounds.getEast();
            const south = bounds.getSouth();
            const north = bounds.getNorth();

            // 現在の表示範囲より少し広めに、256の倍数へスナップして描画開始/終了位置を決める
            const xStart = Math.floor(west / GRID_INTERVAL) * GRID_INTERVAL - GRID_INTERVAL;
            const xEnd = Math.ceil(east / GRID_INTERVAL) * GRID_INTERVAL + GRID_INTERVAL;
            const yStart = Math.floor(south / GRID_INTERVAL) * GRID_INTERVAL - GRID_INTERVAL;
            const yEnd = Math.ceil(north / GRID_INTERVAL) * GRID_INTERVAL + GRID_INTERVAL;

            const gridStyle = { color: '#ffffff', weight: 1, opacity: 0.12, interactive: false };

            // 縦線（X座標が一定の線）
            for (let x = xStart; x <= xEnd; x += GRID_INTERVAL) {
                L.polyline([[yStart, x], [yEnd, x]], gridStyle).addTo(gridLayerGroup);
            }
            // 横線（Z座標が一定の線。leafletY = -z）
            for (let y = yStart; y <= yEnd; y += GRID_INTERVAL) {
                L.polyline([[y, xStart], [y, xEnd]], gridStyle).addTo(gridLayerGroup);
            }
        }

        map.on('moveend zoomend', updateGrid);

        // ==========================================================
        // 🔍 5-1b. ズームアウト時は座標表示を隠して密集を緩和する
        // ==========================================================
        const LOW_ZOOM_THRESHOLD = 0; // これより低いズームレベルでは座標を非表示にする
        const mapEl = document.getElementById('map');

        function updateZoomDensityClass() {
            if (map.getZoom() < LOW_ZOOM_THRESHOLD) {
                mapEl.classList.add('low-zoom');
            } else {
                mapEl.classList.remove('low-zoom');
            }
        }

        map.on('zoomend', updateZoomDensityClass);

        // ==========================================================
        // 📏 5-3. 512刻みのX軸・Z軸ラベル（画面上端・右端に表示するルーラー）
        // ==========================================================
        const AXIS_LABEL_INTERVAL = 512;
        const axisLabelContainer = document.getElementById('axis-labels');

        function updateAxisLabels() {
            axisLabelContainer.innerHTML = '';

            const bounds = map.getBounds();
            const west = bounds.getWest();
            const east = bounds.getEast();
            const south = bounds.getSouth();
            const north = bounds.getNorth();

            // 画面上端：X座標のラベル（512刻み）
            const xStart = Math.ceil(west / AXIS_LABEL_INTERVAL) * AXIS_LABEL_INTERVAL;
            const xEnd = Math.floor(east / AXIS_LABEL_INTERVAL) * AXIS_LABEL_INTERVAL;
            for (let x = xStart; x <= xEnd; x += AXIS_LABEL_INTERVAL) {
                const point = map.latLngToContainerPoint([north, x]);
                const label = document.createElement('div');
                label.className = 'axis-label-x';
                label.textContent = x;
                label.style.left = `${point.x}px`;
                axisLabelContainer.appendChild(label);
            }

            // 画面右端：Z座標のラベル（512刻み。leafletY = -z）
            const yStart = Math.ceil(south / AXIS_LABEL_INTERVAL) * AXIS_LABEL_INTERVAL;
            const yEnd = Math.floor(north / AXIS_LABEL_INTERVAL) * AXIS_LABEL_INTERVAL;
            for (let y = yStart; y <= yEnd; y += AXIS_LABEL_INTERVAL) {
                const z = -y;
                const point = map.latLngToContainerPoint([y, east]);
                const label = document.createElement('div');
                label.className = 'axis-label-z';
                label.textContent = z;
                label.style.top = `${point.y}px`;
                axisLabelContainer.appendChild(label);
            }
        }

        map.on('moveend zoomend move zoom', updateAxisLabels);

        // ==========================================================
        // 📏 6. 十字の基準線（X軸・Z軸）の描画
        // ==========================================================
        L.polyline([[4000, 0], [-4000, 0]], { color: '#3b82f6', weight: 2, opacity: 0.6, dashArray: '6, 6' }).addTo(map);
        L.polyline([[0, -4000], [0, 4000]], { color: '#ef4444', weight: 2, opacity: 0.6, dashArray: '6, 6' }).addTo(map);

        // ==========================================================
        // 📌 7. メンバーのピン（マーカー）の配置と一覧表生成
        // ==========================================================
        const markers = {};

        // 顔アイコンが見つからない場合のプレースホルダー画像（灰色のシルエット）
        const AVATAR_FALLBACK = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><rect width="36" height="36" fill="#26262b"/><circle cx="18" cy="14" r="7" fill="#55555d"/><rect x="6" y="23" width="24" height="11" rx="3" fill="#55555d"/></svg>'
        );
        // 画像の読み込みに失敗した場合、プレースホルダーに差し替える
        function avatarFallback(img) {
            img.onerror = null;
            img.src = AVATAR_FALLBACK;
        }

        const tableBody = document.getElementById('member-table-body');
        const mobileMemberList = document.getElementById('mobile-member-list');
        const countSpan = document.getElementById('member-count');
        countSpan.textContent = memberData.filter(m => m.name && m.name.trim() !== "").length;

        // データ並び替え (エリアが空白でないものを優先、基本は登録順)
        memberData.sort((a, b) => {
            if (!a.area && b.area) return 1;
            if (a.area && !b.area) return -1;
            return a.area.localeCompare(b.area, undefined, {numeric: true, sensitivity: 'base'});
        });

        // 動的アイコン生成用（顔アイコン版）
        // memberData の icon 欄に指定されたファイル名を avatars フォルダから読み込みます
        // name2 が入っている場合は2人分のアイコンを並べて表示します
        function getIcon(member, isRegistered) {
            const hasSecond = isRegistered && member.name2 && member.name2.trim() !== "";

            if (!hasSecond) {
                const avatarSrc = (isRegistered && member.icon)
                    ? `avatars/${member.icon}`
                    : AVATAR_FALLBACK;
                return L.divIcon({
                    className: 'custom-div-icon',
                    html: `
                        <div class="avatar-marker ${isRegistered ? '' : 'unregistered'}">
                            <img src="${avatarSrc}" alt="${member.name}" onerror="avatarFallback(this)" />
                        </div>
                    `,
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
            }

            // 2人分のアイコンを並べて表示
            const avatarSrc1 = member.icon ? `avatars/${member.icon}` : AVATAR_FALLBACK;
            const avatarSrc2 = member.icon2 ? `avatars/${member.icon2}` : AVATAR_FALLBACK;
            return L.divIcon({
                className: 'custom-div-icon',
                html: `
                    <div class="avatar-marker-group">
                        <div class="avatar-marker">
                            <img src="${avatarSrc1}" alt="${member.name}" onerror="avatarFallback(this)" />
                        </div>
                        <div class="avatar-marker">
                            <img src="${avatarSrc2}" alt="${member.name2}" onerror="avatarFallback(this)" />
                        </div>
                    </div>
                `,
                iconSize: [63, 30],
                iconAnchor: [31, 15]
            });
        }

        function initApp() {
            tableBody.innerHTML = '';
            mobileMemberList.innerHTML = '';
            
            memberData.forEach((member, index) => {
                const isRegistered = member.name.trim() !== ""; // 名前が入っているかどうか

                // 未登録（名前が空欄）のメンバーは地図にも一覧にも表示しない
                if (!isRegistered) {
                    return;
                }

                const leafletY = -member.z;
                const leafletX = member.x;

                // マーカーの設置（顔アイコン）
                const marker = L.marker([leafletY, leafletX], { icon: getIcon(member, isRegistered) }).addTo(map);
                
                // メンバー名を「常に表示」するネームタグを設定（顔アイコン＋名前のみのシンプル表示）
                const hasSecond = member.name2 && member.name2.trim() !== "";
                const tooltipText = `
                    <div class="name-line">${hasSecond ? `${member.name}・${member.name2}` : member.name}</div>
                    <div class="coord-line">X: ${member.x}, Z: ${member.z}</div>
                `;
                
                marker.bindTooltip(tooltipText, {
                    permanent: true,
                    direction: 'bottom',
                    offset: [0, 10],
                    className: 'permanent-name-label'
                });
                
                // 一覧でキーとして使うための名前
                const lookupName = member.name;
                markers[lookupName] = marker;

                const displayName = hasSecond ? `${member.name}・${member.name2}` : member.name;
                const searchName = `${member.name} ${member.name2 || ""}`.trim().toLowerCase();
                const searchArea = member.area ? member.area.toLowerCase() : "";

                // テーブル行作成（PC表示）
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#222227] cursor-pointer transition-colors border-b border-gray-800 text-gray-300';
                tr.setAttribute('data-name', searchName);
                tr.setAttribute('data-area', searchArea);
                
                tr.innerHTML = `
                    <td class="py-3 px-4 font-mono font-bold text-green-500">
                        ${member.area || "-"}
                    </td>
                    <td class="py-3 px-4 font-medium text-gray-100">
                        ${displayName}
                    </td>
                    <td class="py-3 px-4 text-right font-mono text-gray-300">
                        ${member.x}
                    </td>
                    <td class="py-3 px-4 text-right font-mono text-gray-300">
                        ${member.z}
                    </td>
                `;

                tr.addEventListener('click', () => {
                    focusOnBase(lookupName, leafletY, leafletX);
                });

                tableBody.appendChild(tr);

                // 顔アイコン付きカード作成（スマホ表示）
                const avatarSrc = member.icon ? `avatars/${member.icon}` : AVATAR_FALLBACK;
                const row = document.createElement('div');
                row.className = 'mobile-member-row';
                row.setAttribute('data-name', searchName);
                row.setAttribute('data-area', searchArea);
                row.innerHTML = `
                    <img class="mm-avatar" src="${avatarSrc}" alt="${member.name}" onerror="avatarFallback(this)" />
                    <div class="mm-text">
                        <div class="mm-name">${displayName}</div>
                        <div class="mm-area">${member.area || ''}</div>
                    </div>
                `;
                row.addEventListener('click', () => {
                    focusOnBase(lookupName, leafletY, leafletX);
                    closeMemberDrawer();
                });
                mobileMemberList.appendChild(row);
            });
        }

        // カメラ移動
        function focusOnBase(name, y, x) {
            map.setView([y, x], 1, { animate: true, duration: 0.8 });
        }

        // 中心 (0, 0) に戻る
        function resetMapView() {
            map.setView([0, 0], -2, { animate: true });
        }

        // 🔍 8. リアルタイム検索機能
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const rows = tableBody.getElementsByTagName('tr');
            const mobileRows = mobileMemberList.getElementsByClassName('mobile-member-row');

            const applyFilter = (el) => {
                const name = el.getAttribute('data-name');
                const area = el.getAttribute('data-area');

                if (query === "") {
                    el.style.display = '';
                } else if (name.includes(query) || area.includes(query)) {
                    el.style.display = '';
                } else {
                    el.style.display = 'none';
                }
            };

            for (let row of rows) applyFilter(row);
            for (let row of mobileRows) applyFilter(row);
        });

        // 🧭 9. マウス位置の座標追跡
        const cursorCoords = document.getElementById('cursor-coords');
        map.on('mousemove', (e) => {
            const x = Math.round(e.latlng.lng);
            const z = Math.round(-e.latlng.lat);
            cursorCoords.textContent = `X: ${x}, Z: ${z}`;
        });

        // ==========================================================
        // 🚀 10. アプリ起動とイベント登録
        // ==========================================================
        initApp();

        // 画像切り替えチェックボックス・地図画像選択ドロップダウンの連動イベント
        populateMapImageSelect();
        document.getElementById('toggle-bg-image').addEventListener('change', loadBackgroundImage);
        document.querySelectorAll('.map-image-select').forEach((sel) => {
            sel.addEventListener('change', (e) => {
                syncMapImageSelects(e.target.value);
                loadBackgroundImage();
            });
        });

        // ==========================================================
        // 📱 スマホ用：メンバー一覧ドロワーの開閉
        // ==========================================================
        const memberDrawer = document.getElementById('member-drawer');
        const drawerBackdrop = document.getElementById('drawer-backdrop');
        const drawerToggleBtn = document.getElementById('member-drawer-toggle');

        function openMemberDrawer() {
            memberDrawer.classList.add('drawer-open');
            drawerBackdrop.classList.remove('hidden');
        }
        function closeMemberDrawer() {
            memberDrawer.classList.remove('drawer-open');
            drawerBackdrop.classList.add('hidden');
        }
        drawerToggleBtn.addEventListener('click', () => {
            if (memberDrawer.classList.contains('drawer-open')) {
                closeMemberDrawer();
            } else {
                openMemberDrawer();
            }
        });
        drawerBackdrop.addEventListener('click', closeMemberDrawer);

        // 一覧の行をタップして地図にジャンプしたら、ドロワーは自動で閉じる
        tableBody.addEventListener('click', (e) => {
            if (e.target.closest('tr')) closeMemberDrawer();
        });

        // ==========================================================
        // 📦 必要ファイル一式をZIPにまとめてダウンロード
        // サーバー上（同じフォルダ）にある最新のファイルを取得してZIP化します
        // ※ file:// で直接開いた場合はブラウザの制限で失敗します（GitHub Pagesなど
        //    サーバー経由で開いている場合のみ動作します）
        // ==========================================================

        // 必須ファイル（1つでも取得に失敗したらZIP作成自体を中止する）
        const REQUIRED_DOWNLOAD_FILES = [
            'minecraft_map.html',
            'background_image_guide.html',
            'memberlist.js'
        ];

        // memberlist.js に登録されているアバター画像のファイル名一覧を集める（重複なし）
        function getAvatarFileList() {
            const files = new Set();
            memberData.forEach((m) => {
                if (m.icon) files.add(`avatars/${m.icon}`);
                if (m.icon2) files.add(`avatars/${m.icon2}`);
            });
            return Array.from(files);
        }

        // 画像類（map・avatars）：1つ見つからなくても他は続行し、ZIPには入れるだけ入れる
        function getOptionalDownloadFiles() {
            return [
                ...mapImageList.map((entry) => entry.fileName),
                ...getAvatarFileList()
            ];
        }

        async function downloadAllFiles() {
            const btn = document.getElementById('download-files-btn');
            const label = document.getElementById('download-files-label');
            const originalLabel = label.textContent;
            btn.disabled = true;
            label.textContent = '準備中...';

            try {
                const zip = new JSZip();

                // 必須ファイル：1つでも失敗したら中止
                await Promise.all(REQUIRED_DOWNLOAD_FILES.map(async (fileName) => {
                    const res = await fetch(fileName, { cache: 'no-store' });
                    if (!res.ok) throw new Error(`${fileName} の取得に失敗しました (HTTP ${res.status})`);
                    const blob = await res.blob();
                    zip.file(fileName, blob);
                }));

                // 画像類：見つからないものはスキップして続行（欠けていてもZIP自体は作る）
                const missingFiles = [];
                await Promise.all(getOptionalDownloadFiles().map(async (fileName) => {
                    try {
                        const res = await fetch(fileName, { cache: 'no-store' });
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const blob = await res.blob();
                        zip.file(fileName, blob);
                    } catch (e) {
                        missingFiles.push(fileName);
                        console.warn(`${fileName} が見つからなかったためZIPに含めていません。`, e);
                    }
                }));

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'homekura_map_files.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                if (missingFiles.length > 0) {
                    alert(`ZIPを作成しましたが、以下のファイルは見つからなかったため含まれていません:\n\n${missingFiles.join('\n')}`);
                }
            } catch (err) {
                console.error(err);
                alert('ファイルの取得に失敗しました。\nGitHub Pagesなどサーバー経由で開いているか確認してください（ローカルでファイルをダブルクリックして開いている場合はブラウザの制限で失敗します）。\n\n詳細: ' + err.message);
            } finally {
                btn.disabled = false;
                label.textContent = originalLabel;
            }
        }

        document.getElementById('download-files-btn').addEventListener('click', downloadAllFiles);

        // 📱 上部バーの実際の高さを測って、マップの余白(padding-top)に反映する
        const mobileTopbarEl = document.getElementById('mobile-topbar');
        function updateMobileTopbarHeight() {
            if (mobileTopbarEl && mobileTopbarEl.offsetHeight > 0) {
                document.documentElement.style.setProperty('--mobile-topbar-height', `${mobileTopbarEl.offsetHeight}px`);
            }
        }

        window.addEventListener('load', () => {
            loadBackgroundImage(); // 初期表示の段階から画像をロード
            map.invalidateSize();
            updateGrid();
            updateAxisLabels();
            updateZoomDensityClass();
            updateMobileTopbarHeight();
            setTimeout(() => { map.invalidateSize(); updateGrid(); updateAxisLabels(); updateMobileTopbarHeight(); }, 200);
        });

        // 📱 スマホの画面回転・リサイズ時に地図サイズを再計算
        window.addEventListener('resize', () => {
            map.invalidateSize();
            updateGrid();
            updateAxisLabels();
            updateMobileTopbarHeight();
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(() => { map.invalidateSize(); updateGrid(); updateAxisLabels(); updateMobileTopbarHeight(); }, 300);
        });
    </script>
</body>
</html>
