<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homeクラ合衆国Season3</title>
    <link rel="icon" href="https://shun-chacha.github.io/homekura-live/img/favicon.ico" type="image/x-icon">
    <link rel="icon" href="https://shun-chacha.github.io/homekura-live/img/icon.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="https://shun-chacha.github.io/homekura-live/img/apple-touch-icon.png">
    <link rel="manifest" href="https://shun-chacha.github.io/homekura-live/site.webmanifest">

    <!-- Leaflet.js (地図ライブラリ) のCSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 🏠 ライトテーマ共通CSS（戻るボタン・スマホ用ドロワーの配色に使用） -->
    <link rel="stylesheet" href="shared/theme.css">
    <!-- 🗺️ 顔アイコン・ネームタグの共通スタイル（地図の比較画面と共通） -->
    <link rel="stylesheet" href="shared/map-markers.css">
    
    <style>
        body {
            background-color: #121214;
        }
        /* Leafletの地図の背景をマイクラの奈落（Void）のような黒基調にする */
        #map-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height:100%;
        }
        #map {
            background-color: var(--custom-void-bg);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
        }
        /* 📏 512刻みのX軸・Z軸ラベル（ルーラー風表示） */
        #axis-labels {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 450;
        }
        /* 🔍 ズームスライダー（無段階ズーム、1/3倍〜3倍） */
        #zoom-slider-wrap {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: rgba(26, 26, 31, 0.9);
            border: 1px solid #333339;
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        #zoom-slider-label {
            font-size: 11px;
            font-family: monospace;
            color: #cbd5c9;
            width: 34px;
            flex-shrink: 0;
            text-align: right;
        }
        #zoom-slider {
            width: 110px;
            accent-color: #4caf50;
            cursor: pointer;
        }
        .axis-label-x {
            position: absolute;
            top: 4px;
            transform: translateX(-50%);
            font-size: 10px;
            font-family: monospace;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(20, 20, 23, 0.55);
            padding: 1px 5px;
            border-radius: 3px;
            white-space: nowrap;
        }
        .axis-label-z {
            position: absolute;
            right: 4px;
            transform: translateY(-50%);
            font-size: 10px;
            font-family: monospace;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(20, 20, 23, 0.55);
            padding: 1px 5px;
            border-radius: 3px;
            white-space: nowrap;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e24;
        }
        ::-webkit-scrollbar-thumb {
            background: #4caf50;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #45a049;
        }
        

        /* 外部画像を使わない「光るアニメーションピン」のCSS */
        .pulse-marker {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-core {
            width: 10px;
            height: 10px;
            background-color: #4caf50;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #4caf50;
            z-index: 2;
        }
        /* 未登録（名前が空白）のピンはグレーにする */
        .pulse-marker.unregistered .pulse-core {
            background-color: #55555d;
            border: 2px solid #aaaaaa;
            box-shadow: none;
        }
        .pulse-wave {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: rgba(76, 175, 80, 0.4);
            border-radius: 50%;
            animation: pulse 1.8s infinite ease-out;
            z-index: 1;
        }
        .pulse-marker.unregistered .pulse-wave {
            display: none; /* 未登録のピンは波打つアニメーションをオフにする */
        }
        @keyframes pulse {
            0% {
                transform: scale(0.2);
                opacity: 1;
            }
            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }


        /* 🎨 左パネル（一覧・UI）の背景色をカスタム変数に対応させる（PC表示のみ有効） */
        .drawer-header,
        .drawer-panel {
            background-color: var(--custom-panel-bg) !important;
        }

        /* 🗺️ 地図の表示項目（メンバー選択の下に常に表示。PCでは項目が多い時はこの中だけスクロール。スマホではメニューの中に表示） */
        #color-customizer-panel {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            background: #141417;
            border: 1px solid #333339;
            border-radius: 12px;
            padding: 14px;
        }
        #color-customizer-panel h3 {
            color: #4caf50;
            font-size: 13px;
            font-weight: bold;
            margin: 0 0 10px;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #cbd5c9;
            cursor: pointer;
        }
        .toggle-row input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
        .panel-hint {
            font-size: 11px;
            color: #facc15;
            margin: 4px 0 8px;
        }
        .panel-divider {
            border-top: 1px solid #333339;
            margin: 10px 0 12px;
        }
        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .color-row label {
            font-size: 11px;
            color: #cbd5c9;
            flex: 1;
        }
        .color-row input[type="color"] {
            width: 32px;
            height: 24px;
            border: 1px solid #333339;
            border-radius: 4px;
            background: none;
            padding: 0;
            cursor: pointer;
            flex-shrink: 0;
        }
        .color-row input[type="text"].hex-input {
            width: 68px;
            flex-shrink: 0;
            font-size: 10px;
            font-family: monospace;
            background: #141417;
            border: 1px solid #333339;
            border-radius: 4px;
            color: #cbd5c9;
            padding: 3px 5px;
        }
        .color-row input[type="text"].hex-input:focus {
            outline: none;
            border-color: #4caf50;
        }
        .color-row input[type="checkbox"].transparent-check {
            flex-shrink: 0;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
        .color-row.is-transparent input[type="color"],
        .color-row.is-transparent input[type="text"].hex-input {
            opacity: 0.35;
            pointer-events: none;
        }
        #color-customizer-reset {
            width: 100%;
            margin-top: 8px;
            font-size: 11px;
            font-weight: bold;
            color: #cbd5c9;
            background: #26262b;
            border: 1px solid #4a4a52;
            border-radius: 6px;
            padding: 6px 0;
            cursor: pointer;
            transition: 0.2s;
        }
        #color-customizer-reset:hover {
            background: #333339;
            color: #fff;
        }

        /* 📱 スマホ幅（lg未満）：マップを全画面表示にし、メンバー一覧はドロワー化する */
        @media (max-width: 1023px) {
            /* 地図の表示項目：メニュー（ドロワー）の中に、ドロワーと同じ明るい配色で表示する */
            #member-drawer #color-customizer-panel {
                margin-top: 16px;
                background: #ffffff;
                border: 1px solid var(--border-color, #d8e2d7);
            }
            #member-drawer #color-customizer-panel h3 {
                color: var(--accent-green, #2d5a27);
            }
            #member-drawer .toggle-row,
            #member-drawer .color-row label {
                color: var(--text-color, #1a2418);
            }
            #member-drawer .color-row input[type="text"].hex-input {
                background: #ffffff;
                border-color: var(--border-color, #d8e2d7);
                color: var(--text-color, #1a2418);
            }
            #member-drawer .panel-divider {
                border-top-color: var(--border-color, #d8e2d7);
            }
            #member-drawer .panel-hint {
                color: #b45309; /* 白い背景では黄色が読みにくいので濃い黄土色にする */
            }
            #member-drawer #color-customizer-reset {
                background: var(--bg-color, #eef3ee);
                border-color: var(--border-color, #d8e2d7);
                color: var(--secondary-text, #414d3f);
            }
            #map-wrap {
                position: fixed !important;
                inset: 0 !important;
                height: 100vh !important;
                width: 100vw !important;
                z-index: 10;
            }
            #map-wrap > section {
                border-radius: 0 !important;
                border: none !important;
                padding-top: var(--mobile-topbar-height, 116px) !important; /* 上部の固定バーの高さ分だけ余白を確保（JSで実測して更新） */
            }

            /* ドロワー全体：index.htmlと同じライトテーマに */
            #member-drawer {
                position: fixed !important;
                top: 0;
                left: 0;
                width: 85% !important;
                max-width: 360px;
                height: 100vh !important;
                z-index: 1280;
                transform: translateX(-100%);
                transition: transform 0.25s ease-out;
                overflow-y: auto;
                padding: 16px 12px;
                background: var(--bg-color, #eef3ee) !important;
                display: block !important; /* テーブル用の固定高さレイアウトをやめ、自然な縦積みにする */
            }
            #member-drawer.drawer-open {
                transform: translateX(0);
            }
            #member-drawer .drawer-header {
                background: transparent !important;
                border: none !important;
                padding: 0 0 16px !important;
                text-align: left !important;
            }
            #member-drawer .drawer-header h1 {
                color: var(--accent-green, #2d5a27) !important;
                font-size: 18px !important;
            }
            #member-drawer .drawer-header p {
                color: var(--secondary-text, #414d3f) !important;
                font-size: 12px !important;
            }
            #member-drawer .drawer-panel {
                background: transparent !important;
                border: none !important;
                padding: 0 !important;
                height: auto !important;
                display: block !important;
            }
            #member-drawer #member-count {
                color: var(--accent-green, #2d5a27) !important;
            }
            #member-drawer #member-count-label {
                color: var(--secondary-text, #414d3f) !important;
            }
            #member-drawer #download-files-btn,
            #member-drawer a[href="background_image_guide.html"] {
                background: var(--bg-color, #eef3ee) !important;
                border-color: var(--border-color, #d8e2d7) !important;
                color: var(--secondary-text, #414d3f) !important;
            }
            #member-drawer #download-files-btn:hover,
            #member-drawer a[href="background_image_guide.html"]:hover {
                background: var(--accent-green-light, #e8f5e8) !important;
                color: var(--accent-green, #2d5a27) !important;
            }
            #member-drawer #member-select {
                background: #ffffff !important;
                border: 1px solid var(--border-color, #d8e2d7) !important;
                color: var(--text-color, #1a2418) !important;
            }
        }

    </style>
    <!-- Cloudflare Web Analytics (要: 実トークンに差し替え。Cloudflareダッシュボード > Web Analytics > Add a site で取得) -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "ef48e3b395a94deb8375d839e1887bb2"}'></script>

</head>
<body class="text-gray-100 bg-[#121214]">
<!-- 📱 スマホ専用：常に表示される上部バー（タイトル・戻る/メニュー・地図切り替え） -->
    <div id="mobile-topbar" class="lg:hidden fixed top-0 left-0 right-0 z-[1300] bg-[#1a1a1f]/95 backdrop-blur border-b border-gray-800 px-3 py-2 flex flex-col gap-2">
        <!-- 1行目：タイトル -->
        <div class="text-green-500 font-extrabold text-sm text-center truncate">homeクラ Season3 メンバー拠点マップ</div>

        <div class="flex items-center justify-between gap-2">
            <a href="index.html" class="pill-btn-light">🏠 ポータルに戻る</a>
            <button id="member-drawer-toggle" class="pill-btn-light">☰ 設定MENU</button>
        </div>
        <!-- 3行目：地図画像の切り替え -->
        <select class="map-image-select w-full bg-[#26262b] border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-green-500">
            <!-- JavaScriptで mapImageList から動的に生成 -->
        </select>
    </div>

    <!-- 📱 スマホ専用：ドロワーを開いた時の背景オーバーレイ（タップで閉じる） -->
    <div id="drawer-backdrop" class="lg:hidden fixed inset-0 bg-black/60 z-[1250] hidden"></div>

    
<div class="max-w-[1800px] mx-auto p-2 sm:p-4">
<div class="flex flex-col lg:flex-row gap-4 lg:h-screen">
<aside id="member-drawer" class="w-full lg:w-[430px] flex flex-col gap-4 flex-shrink-0">
<div class="drawer-header bg-[#1a1a1f] border-b border-gray-800 py-4 sm:py-6 px-4 text-center relative">
        <div class="hidden lg:flex text-left mb-3 gap-2">

    </div>
<section class="drawer-panel w-full lg:w-[450px] bg-[#1a1a1f] rounded-xl border border-gray-800 p-4 flex flex-col h-[320px] lg:h-[650px]">
            
            <!-- メンバー選択と情報統計 -->
            <div class="mb-4">
                <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
                    <span id="member-count-label" class="text-sm font-semibold text-gray-400">登録メンバー: <span id="member-count" class="text-green-500 font-bold">0</span>名</span>
                    <div class="flex flex-wrap items-center gap-2">
                        <button id="download-files-btn"
   class="text-xs bg-[#26262b] hover:bg-[#333339]
          border border-gray-700 hover:border-green-500

          transition-colors inline-flex items-center gap-1.5">
    <span>📦</span>
    <span id="download-files-label">ファイル一式をDL</span>
</button>
                        <a href="background_image_guide.html"
   class="text-xs bg-[#26262b] hover:bg-[#333339]
          border border-gray-700 hover:border-green-500
          text-gray-300 hover:text-green-400
          font-bold px-3 py-1.5 rounded-full
          transition-colors inline-flex items-center gap-1.5">
    <span>🛠️</span>
    <span>背景画像の設定ガイド</span>
</a>
                    </div>
                </div>
                <!-- メンバーを選ぶと地図上の拠点にジャンプする -->
                <select id="member-select" class="w-full bg-[#26262b] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-green-500 transition-colors">
                    <option value="">メンバーを選んで拠点へ移動…</option>
                    <!-- JavaScriptで memberData から動的に生成 -->
                </select>
            </div>

            <!-- 🗺️ 地図の表示項目（色・透明の設定。この端末のみ保存） -->
            <div id="color-customizer-panel">
                <h3>🗺️ 地図の表示項目（この端末のみ保存）</h3>

                <label class="toggle-row"><input type="checkbox" id="cc-show-grid" checked> グリッド線（1チャンクごとの白い格子）を表示</label>
                <label class="toggle-row"><input type="checkbox" id="cc-show-plots" checked> 区画の枠線を表示</label>
                <label class="toggle-row"><input type="checkbox" id="cc-show-faces" checked> 顔アイコンを表示</label>
                <label class="toggle-row"><input type="checkbox" id="cc-show-names" checked> 名前を表示</label>
                <label class="toggle-row"><input type="checkbox" id="cc-show-coords" checked> 座標を表示</label>
                <div class="panel-divider"></div>

                <div class="color-row" data-key="voidBg">

                </div>
                <div class="color-row" data-key="gridColor">
                    <label>1チャンク（16ブロック）刻みグリッド線の色</label>
                    <input type="text" class="hex-input" id="cc-grid-color-text" value="#ffffff" maxlength="7">
                    <input type="color" id="cc-grid-color" value="#ffffff">
                </div>
                <div class="color-row" data-key="xAxisColor">
                    <label>X軸（左右）中心線の色</label>
                    <input type="checkbox" class="transparent-check" id="cc-x-axis-color-transparent" title="表示する">
                    <input type="text" class="hex-input" id="cc-x-axis-color-text" value="#ef4444" maxlength="7">
                    <input type="color" id="cc-x-axis-color" value="#ef4444">
                </div>
                <div class="color-row" data-key="zAxisColor">
                    <label>Z軸（上下）中心線の色</label>
                    <input type="checkbox" class="transparent-check" id="cc-z-axis-color-transparent" title="表示する">
                    <input type="text" class="hex-input" id="cc-z-axis-color-text" value="#3b82f6" maxlength="7">
                    <input type="color" id="cc-z-axis-color" value="#3b82f6">
                </div>
                <div class="color-row" data-key="panelBg">
                    <label>左パネル（一覧）の背景色</label>
                    <input type="text" class="hex-input" id="cc-panel-bg-text" value="#1a1a1f" maxlength="7">
                    <input type="color" id="cc-panel-bg" value="#1a1a1f">
                </div>

                <div class="color-row" data-key="iconBorder">
                    <label>顔アイコンの枠線の色</label>
                    <input type="checkbox" class="transparent-check" id="cc-icon-border-transparent" title="表示する">
                    <input type="text" class="hex-input" id="cc-icon-border-text" value="#4caf50" maxlength="7">
                    <input type="color" id="cc-icon-border" value="#4caf50">
                </div>
                <div class="color-row" data-key="textColor">

                    <input type="color" id="cc-text-color" value="#ffffff">

                <div class="color-row" data-key="textBg">
                    <label>ネームタグの背景色</label>
                    <input type="checkbox" class="transparent-check" id="cc-text-bg-transparent" title="表示する">

                <button id="color-customizer-reset">初期設定にリセット</button>
            </div>
        </section>
</aside>

                    </div>

                    <!-- 📍 カーソル位置のリアルタイム表示・中心に戻るボタン -->

                        <div class="flex items-center gap-2 mb-2 text-gray-300">
                            <span class="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse flex-shrink-0"></span>
                            <span>現在地: <strong class="text-white font-mono" id="cursor-coords">X: 0, Z: 0</strong></span>
                        </div>
                        <button 
                            onclick="resetMapView()" 
                            class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-1 px-3 rounded text-xs transition-colors"
                        >
                            地図全体の表示に戻る
                        </button>
                    </div>
                    
                    <!-- 💡 地形マップ切り替えチェックボックス -->
                    <div class="border-t border-gray-700 pt-2 mt-2">
                        <label class="flex items-center gap-2 cursor-pointer text-gray-300 hover:text-white transition-colors">
                            <input type="checkbox" id="toggle-bg-image" class="rounded bg-gray-850 border-gray-600 text-green-500 focus:ring-green-500 focus:ring-offset-gray-900" checked>
                            <span>地図背景を表示</span>
                        </label>
                    </div>
                </details>

                <!-- 🗺️ 月別マップ選択：折りたたんでもここは常に表示されたままにする -->
                <div class="bg-[#222227] border border-gray-700 border-t-0 rounded-b-lg p-2 shadow-lg">
                    <select id="map-image-select" class="map-image-select w-full bg-[#26262b] border border-gray-700 rounded px-2 py-1 text-xs text-gray-200 focus:outline-none focus:border-green-500">
                        <!-- JavaScriptで mapImageList から動的に生成 -->
                    </select>
                </div>
            </div>

            <!-- マップ本体コンテナ -->
            <div id="map-container" class="map-display-target flex-1 w-full rounded-lg border border-gray-800 overflow-hidden">
                <div id="map"></div>
                <div id="axis-labels"></div>
                <div id="zoom-slider-wrap">
                    <span id="zoom-slider-label">1.0×</span>
                    <input type="range" id="zoom-slider" min="-4.5" max="2.08496" step="0.001" value="0">
                </div>
            </div>
        </section>
</section>
</div>
</div>


    <!-- Leaflet.js のJavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- 📊 メンバーデータは js/data/MAP_member.js に分離（編集はそちらのファイルで） -->
    <script src="js/data/MAP_member.js"></script>

    <!-- 📍 メンバー以外の目印（方位磁針・共有地など）は js/data/MAP_locations.js に分離 -->
    <script src="js/data/MAP_locations.js"></script>

    <!-- 🟥 区画の枠線（背景画像とは別に線で描く）は js/data/MAP_plots.js に分離 -->
    <script src="js/data/MAP_plots.js"></script>

    <!-- 🧩 機能ごとに分割したJSコンポーネント（js/フォルダ） -->
    <script src="js/map/color-customizer.js"></script>
    <script src="js/map/map-config.js"></script>
    <script src="js/map/map-grid.js"></script>
    <script src="js/map/member-list.js"></script>
    <script src="js/map/location-list.js"></script>
    <script src="js/map/plot-frames.js"></script>
    <script src="js/map/mobile-ui.js"></script>
    <script src="js/map/download-zip.js"></script>
    <script src="js/map/zoom-slider.js"></script>

    <script>
        // ==========================================================
        // ⚙️ マップ初期設定 (マイクラ平面座標)
        // ==========================================================
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -4.5,      // 1ブロック≒0.044px。スマホ（比較画面の半分の幅でも）一辺3,000ブロック（中心から±1,500）の地図を全体表示できる
            maxZoom: 2.08496,   // 1ブロック≒4.2px（区画の顔アイコンが見やすい大きさ）
            zoomSnap: 0,        // 無段階ズームを可能にする
            zoomDelta: 0,
            zoomControl: false, // 標準の +/- ボタンは使わず、スライダーに置き換える
            attributionControl: false
        });

        map.setView([0, 0], 0);

        // ==========================================================
        // 🚀 各コンポーネントの初期化（map-config → map-grid → member-list → mobile-ui → download-zip）
        // ==========================================================
        MapApp.mapConfig.init(map);
        MapApp.mapGrid.init(map);
        MapApp.plotFrames.create(map);
        MapApp.memberList.init(map);
        MapApp.mapLocations.init(map);
        MapApp.mobileUI.init();
        MapApp.downloadZip.init();
        // 初期表示：最新の地図画像（mapImageList の先頭）全体が画面に収まる最大の倍率で表示する
        // 「地図全体の表示に戻る」ボタンもこれを呼ぶ。地図画像がなければ (0, 0) を表示
        window.fitMapHomeView = function (animate) {
            const entry = MapApp.mapConfig.mapImageList[0];
            map.invalidateSize();
            if (entry) {
                map.fitBounds(MapApp.mapConfig.toLeafletBounds(entry.bounds), { animate: !!animate });
            } else {
                map.setView([0, 0], -2, { animate: !!animate });
            }
        };
        fitMapHomeView(false);

        MapApp.zoomSlider.init({ map: map, baseline: map.getZoom() });
        MapApp.colorCustomizer.initUI();

        // ==========================================================
        // 🖼️ 画面読み込み・リサイズ時の再計算まわり（各コンポーネントへ委譲するオーケストレーション）
        // ==========================================================
        window.addEventListener('load', () => {
            MapApp.mapConfig.loadBackgroundImage(); // 初期表示の段階から画像をロード
            map.invalidateSize();
            MapApp.mapGrid.updateGrid();
            MapApp.mapGrid.updateAxisLabels();
            MapApp.mapGrid.updateZoomDensityClass();
            MapApp.mobileUI.updateMobileTopbarHeight();
            MapApp.colorCustomizer.applyCustomColors();
            setTimeout(() => {
                map.invalidateSize();
                MapApp.mapGrid.updateGrid();
                MapApp.mapGrid.updateAxisLabels();
                MapApp.mobileUI.updateMobileTopbarHeight();
            }, 200);
        });

        // 📱 スマホの画面回転・リサイズ時に地図サイズを再計算
        window.addEventListener('resize', () => {
            map.invalidateSize();
            MapApp.mapGrid.updateGrid();
            MapApp.mapGrid.updateAxisLabels();
            MapApp.mobileUI.updateMobileTopbarHeight();
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                map.invalidateSize();
                MapApp.mapGrid.updateGrid();
                MapApp.mapGrid.updateAxisLabels();
                MapApp.mobileUI.updateMobileTopbarHeight();
            }, 300);
        });
    </script>
</body>
</html>
